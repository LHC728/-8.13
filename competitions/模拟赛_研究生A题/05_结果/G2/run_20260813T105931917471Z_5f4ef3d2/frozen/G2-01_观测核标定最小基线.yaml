evidence_package_contract:
  root: "05_结果/G2/run_<immutable_run_id>/"
  exact_layout:
    - "run_manifest.json"
    - "commands.json"
    - "file_hashes.sha256"
    - "frozen/G2-01_观测核标定最小基线.yaml"
    - "frozen/parameters.csv"
    - "frozen/observation_calibration_v1.schema.json"
    - "frozen/observation_calibration_oracles_v1.json"
    - "single_test_unconditional_v1/request.json"
    - "single_test_unconditional_v1/response.json"
    - "single_test_unconditional_v1/check_report.json"
    - "single_test_unconditional_v1/e1.stdout.txt"
    - "single_test_unconditional_v1/e1.stderr.txt"
    - "single_test_unconditional_v1/e2.stdout.txt"
    - "single_test_unconditional_v1/e2.stderr.txt"
    - "standard_chain_v1/request.json"
    - "standard_chain_v1/response.json"
    - "standard_chain_v1/check_report.json"
    - "standard_chain_v1/e1.stdout.txt"
    - "standard_chain_v1/e1.stderr.txt"
    - "standard_chain_v1/e2.stdout.txt"
    - "standard_chain_v1/e2.stderr.txt"
  canonical_requests:
    - "两个 request 的 scenario_role=canonical_g2_abc，items 严格 A,B,C，且分别绑定 P026/P030、P027/P031、P028/P032；禁止 E。"
    - "request_id 分别为 <run_id>:single_test_unconditional_v1 与 <run_id>:standard_chain_v1。"
    - "所有 q/e 数字只允许 E1 从本 run 的 frozen/parameters.csv 实际读取后进入 response；runner 不填标定数字。"
  serialization:
    json: "UTF-8、sort_keys=True、separators=(',', ':')、末尾 LF；数组顺序按本包冻结，禁止按哈希或文件系统顺序。"
    text_logs: "UTF-8，原样保存子进程 stdout/stderr；不得摘要替换。"
    hash_inventory: "file_hashes.sha256 使用小写 SHA-256、两个空格、POSIX 相对路径、按路径 Unicode code-point 升序、LF；排除 file_hashes.sha256 自身且不得列目录。"
  run_manifest_required:
    - "schema envelope calibration_run_manifest 的全部必填字段。"
    - "Schema 的 artifacts minItems=0 仅使早期失败可表达，不是 PASS 放宽。PASS 时 artifacts 必须恰好覆盖至少以下11项语义产物且每项路径/role唯一：task package、parameters、schema、fixture、2 request、2 response、2 check_report、commands.json；此外所有实际 stdout/stderr 均按 stdout_log/stderr_log role 枚举。"
    - "FAIL/INCOMPLETE 时 artifacts 只列实际存在文件，可为0项；不得为满足数量伪造占位。E2 preflight 失败允许缺对应 check_report，但实际存在的 commands.json、stdout/stderr 必须列入，并由 manifest notes 记录 REPORT_CONTEXT_PREFLIGHT_FAILED。"
    - "task package hash 只在 manifest/artifact inventory 记录；任务包内不得自引用自身 hash。"
    - "manifest 不记录自身 hash；其 hash 只在 file_hashes.sha256 中记录。"
  check_report_required:
    - "每语义一个 calibration_check_report；包含 run/check IDs、scenario_role、semantics、checker_status、四项冻结输入/输出 hash、逐 process 独立值与残差。"
    - "E2 只验证 response；不得读取 request。"
    - "report-context preflight 失败时 check_report 明确不存在；这不违反 schema，因为无 report 被序列化。已有 --report 文件必须保持 SHA-256 与字节数不变。"
  command_log_required:
    - "Schema 的 commands minItems=0 仅使子进程启动前失败可表达，不是 PASS 放宽。PASS 时 commands.json 必须恰有4条并按 E1主语义、E2主语义、E1替代语义、E2替代语义的冻结顺序记录精确 argv、cwd、UTC 起止、退出码及 stdout/stderr 相对路径。FAIL/INCOMPLETE 只记录实际启动的0至4条命令。"
    - "argv 使用 JSON 字符串数组而非 shell 拼接文本；runner 使用 subprocess.run(..., shell=False)。"
  completion_rule:
    - "只有 artifacts 满足 PASS 的11项语义产物最低集合、commands 恰有4条、两个 E1 exit=0、两个 E2 exit=0 且 checker_status=PASS、所有声明文件存在、全部实际日志已枚举、冻结输入 hash 匹配，manifest overall_status 才能为 PASS。结构 schema 的 minItems=0 不得用于降低该语义门。"
    - "所有数值仅从 E1 子进程实际 response 原样进入证据包；runner 不复制聊天、fixture 期望或手算数为运行结果。"
    - "证据包创建后不可覆盖；验证发现失败时保留目录并标 FAIL/INCOMPLETE。"

integration_acceptance:
  commands:
    - "python -m json.tool 04_代码/src/schemas/observation_calibration_v1.schema.json"
    - "python -m json.tool 04_代码/tests/fixtures/observation_calibration_oracles_v1.json"
    - "python -m unittest discover -s 04_代码/tests -p 'test_observation_calibration_*_v1.py' -v"
    - "python -m unittest 04_代码/tests/test_run_g2_01_v1.py -v"
    - "python 04_代码/scripts/run_g2_01_v1.py --parameters 02_数据/parameters.csv --task-package 08_项目管理/任务包/G2-01_观测核标定最小基线.yaml --schema 04_代码/src/schemas/observation_calibration_v1.schema.json --fixture 04_代码/tests/fixtures/observation_calibration_oracles_v1.json --output-root 05_结果/G2"
    - "git diff --check -- 08_项目管理/任务包/G2-01_观测核标定最小基线.yaml 04_代码/src/schemas/observation_calibration_v1.schema.json 04_代码/tests/fixtures/observation_calibration_oracles_v1.json 04_代码/main_model/observation_calibration_v1.py 04_代码/checker/observation_calibration_checker_v1.py 04_代码/tests/test_observation_calibration_main_v1.py 04_代码/tests/test_observation_calibration_checker_v1.py"
  required_tests:
    - "fixture 全案例在两个隔离通道得到相同 status/free_parameters。"
    - "唯一解 alpha/beta 跨通道差<=5e-11，且各自原始残差通过。"
    - "q=0、q=1、e=0、单次不可行、替代不可行、精确边界、近边界和可行内部点全部覆盖。"
    - "canonical A/B/C 确认实际从 P026-P028/P030-P032 读取；修改 CSV 临时副本值会改变输出，证明未硬编码。"
    - "重复/缺失 parameter_id、E canonical、非法 decimal、域外值、额外字段均按冻结错误行为失败。"
    - "故意交换 A 的 q/e parameter_id、给不可识别参数填 0、放宽边界 1e-6、把候选解投影到 [0,1]，测试必须捕获；已证明 codomain 与区间外包络的集合交不属于此禁令。"
    - "替代链 t=0 与 t=t_max 的 interval-codomain 测试必须证明 alpha/beta 证书端点保持在 [0,1]，不会因 sqrt(0/1) 的 next_minus/next_plus 外包络毛刺误报 NUMERICAL_FAILURE。"
    - "E2 CLI 传入 --request 必须拒绝；文件访问测试证明 E2 未打开 request、fixture、E1 源码或其他文档。"
    - "canonical E2 从 response.request_id 严格派生父 run_id；后缀/semantics 或前缀 regex 不符均 validation exit 2，且不得生成替代时间戳。"
    - "预置 --report 哨兵文件后触发 malformed request_id：exit 2、stderr 非空且哨兵 SHA-256/字节不变；目标原先不存在时运行后仍不存在。runner 必须以无 report 的 FAIL/INCOMPLETE manifest 留证。"
    - "q=0.01 近退化和 q=0.5 近无理边界案例：两通道 root alpha/beta 外向区间跨度及 root+reported点最小外向凸包跨度均各<=1e-12；reported 回读残差<=5e-12；跨通道 reported 参数差<=5e-11；不得要求 reported 点属于 root interval。"
    - "超长小数按 p0 自适应精度与最多十次80位加精执行；未稳定时 NUMERICAL_FAILURE，不得 epsilon 分类。"
    - "runner 生成精确目录布局、两个 canonical request、四条命令记录、完整 manifest 与排除自哈希的 inventory；重复 run_id 必须失败且不覆盖。"
  hashes_required:
    - "schema SHA-256"
    - "parameters.csv SHA-256"
    - "fixture SHA-256"
    - "E1/E2 代码与测试 SHA-256"
    - "原始 request/response/check report SHA-256（若产生）"
  no_pass_claim_yet: "本规格任务完成只表示可派发；CR-V3.1/C01、CR-V3.1/C02、CR-V3.1/C19、CR-V3.1/C21 尚需 E1/E2 实际运行与 D 语义验收。"

must_not_change:
  - "主/替代语义角色、公式、必要充分可行条件、端点不可识别语义。"
  - "canonical 参数 ID、只含 A/B/C 的范围，以及 E q_E 延后闭合。"
  - "schema、fixture、测试期望、分类规则、求根/验证/序列化容差和停止规则。"
  - "E1/E2 文件隔离、算法异源性、只用标准库和禁止联网。"
  - "不得新增默认值、裁剪/投影候选概率解、删除失败样本、发布正式数字或修改论文；唯一允许的 [0,1] 操作是 numeric_policy 已冻结的区间外包络与已证明 codomain 的集合交。"

mandatory_escalation:
  format: "事实—选项—影响—建议"
  template:
    事实: "最小复现、权威来源冲突或未定义行为；附实际输入、命令和错误。"
    选项: "最多两个候选处理；不得自行实施。"
    影响: "分别说明对公式、schema、fixture、检查 ID、重跑范围和结论的影响。"
    建议: "E 可提出有证据的建议，但决策留给 D/队伍。"
  triggers:
    - "权威文件、schema、fixture 或本任务包冲突。"
    - "遇到未定义状态，或需要选择新公式、根、默认、容差、精度、算法、依赖。"
    - "可行性、存在唯一性、oracle、E1/E2 输出或原始残差不一致。"
    - "需要访问/修改允许路径外文件，或连续两次修复仍失败。"

completion_report_schema: |
  STATUS: PASS | PARTIAL | BLOCKED
  AGENT: name / agent_id
  MODEL_REQUEST: ...
  MODEL_SOURCE: explicit_override | inherited_unverified
  MODEL_RUNTIME_VERIFICATION: explicit_request_sent | inherited_unverified | tool_reported:...
  REASONING_EFFORT: ...
  LEVEL_ROLE: ...
  SCOPE: 实际读取/修改文件
  CHANGES: 机械描述
  RUNS: 实际命令、退出码、参数版本
  TESTS: 通过数、失败数及失败名称
  OUTPUTS: 文件、行数/尺寸/SHA-256
  CHILD_AGENTS_USED: NONE
  DEVIATIONS: NONE | ...
  WARNINGS: NONE | ...
  DECISIONS_MADE: NONE
