interface_contract:
  schema_version: "observation_calibration_v1"
  envelope_types: ["calibration_request", "calibration_response", "calibration_check_report", "calibration_run_manifest", "calibration_command_log"]
  input_summary:
    request_fields:
      - "schema_version: const observation_calibration_v1"
      - "envelope_type: const calibration_request"
      - "request_id: 非空稳定字符串"
      - "scenario_role: canonical_g2_abc | generic | test_oracle"
      - "semantics: single_test_unconditional_v1 | standard_chain_v1"
      - "items: 非空数组；每项含 process_id 与 canonical_parameter_ref 或 direct_values"
    decimal_encoding: "q/e 使用 JSON 十进制字符串；禁止 NaN、Infinity、指数拼写和二进制浮点预处理。"
  output_summary:
    response_fields:
      - "schema_version, envelope_type, request_id, semantics"
      - "overall_status: ALL_IDENTIFIED | HAS_NONIDENTIFIABLE | HAS_INFEASIBLE | FAILED_VALIDATION | NUMERICAL_FAILURE"
      - "results: 与输入 items 同序且等长"
      - "每项 status: UNIQUE_SOLUTION | NONIDENTIFIABLE_FAMILY | INFEASIBLE"
      - "q,e,alpha,beta,e_max 为 canonical 普通十进制字符串或 schema 允许的 null"
      - "diagnostics 记录 method、feasibility、brackets、iterations、residuals 和 tolerance_profile"
    ordering: "保留请求 items 顺序；canonical_g2_abc 必须严格 A,B,C。"
    serialization: "Python json.dump(..., ensure_ascii=False, sort_keys=True, separators=(',', ':'))；UTF-8；文件末尾一个 LF。"
  cli_contracts:
    E1_exact_cli: "python 04_代码/main_model/observation_calibration_v1.py --request <request.json> --parameters <parameters.csv> --output <response.json>"
    E1_exit_codes:
      0: "请求有效且完成；允许 response 含 INFEASIBLE/NONIDENTIFIABLE 数学状态。"
      2: "输入 envelope、canonical binding 或参数 CSV 验证失败；不得写部分 response。"
      3: "括区间、迭代、Decimal 或残差数值失败；不得写成功 response。"
      4: "文件 I/O 或不可恢复序列化失败。"
    E2_exact_cli: "python 04_代码/checker/observation_calibration_checker_v1.py --response <response.json> --parameters <parameters.csv> --schema <schema.json> --task-package <task_package.yaml> --report <check_report.json>"
    E2_input_rule: "禁止 request 参数和 request 文件；只从 response 的 scenario_role、semantics、process_id、q、e 独立复核，canonical 时再对 parameters.csv 的 parameter_id 回代。task package/schema 使用冻结固定路径。"
    E2_run_id_rule: >-
      E2 在任何 report 写入前先执行 report-context preflight：只读取 response JSON 顶层 scenario_role、request_id、semantics；
      scenario_role 必须为 canonical_g2_abc，request_id 必须能按最后一个冒号严格拆成 <run_id>:<semantics>，后缀必须与 response.semantics 字节相同，
      前缀必须匹配 ^[0-9]{8}T[0-9]{12}Z_[0-9a-f]{8}$。任一条件失败则 exit 2、错误写 stderr，且 --report 目标必须不存在或保持原字节不变，
      不得创建、截断、覆盖或另造时间戳。仅 preflight 成功后，前缀才成为唯一 report_context_run_id，并原样写入所有后续 PASS/FAIL/VALIDATION_ERROR/NUMERICAL_ERROR report。
      generic/test_oracle CLI 同属 preflight 失败，不生成正式 report；其单元测试只调用 checker 内部纯函数。
    E2_exit_codes:
      0: "check_report.checker_status=PASS。"
      1: "独立回代、分类、绑定或残差检查 FAIL；写完整 FAIL report。"
      2: "若 report-context preflight 失败，只写 stderr 且不得创建或触碰 report；若 preflight 已成功，则后续 response/schema/parameters 验证错误写 schema-valid VALIDATION_ERROR report，并使用已派生父 run_id。"
      3: "checker 自身数值失败；写 NUMERICAL_ERROR report。"
      4: "文件 I/O 或不可恢复序列化失败。"

mathematical_specification:
  common:
    definitions:
      - "q=P(X=1)，e 为所选语义的总体差错参照，alpha=P(Y=1|X=0)，beta=P(Y=0|X=1)。"
      - "输入域必要条件：q,e 均为有限十进制且 0<=q<=1、0<=e<=1。域外是 FAILED_VALIDATION，不是 INFEASIBLE。"
    endpoint_identifiability:
      q_zero: "当且仅当 e=0 可行；alpha=0 被识别，beta 在 [0,1] 任意且不可识别，输出 beta=null、free_parameters=['beta']。"
      q_one: "当且仅当 e=0 可行；beta=0 被识别，alpha 在 [0,1] 任意且不可识别，输出 alpha=null、free_parameters=['alpha']。"
      forbidden_default: "不可识别参数不得默认填 0、0.5 或 1，不得标成 UNIQUE_SOLUTION。"
  single_test_unconditional_v1:
    equations:
      - "(1-q)*alpha = e/2"
      - "q*beta = e/2"
    interior_solution: "0<q<1 时 alpha=e/[2(1-q)]，beta=e/(2q)。"
    necessary_and_sufficient_feasibility: "0<q<1 时当且仅当 e<=2*min(q,1-q)；可行解唯一。端点按 common.endpoint_identifiability。"
    boundary_cases:
      - "e=0 且 0<q<1：唯一 alpha=beta=0。"
      - "e=2q<2(1-q)：beta=1。"
      - "e=2(1-q)<2q：alpha=1。"
      - "q=1/2,e=1：alpha=beta=1。"
    method: "直接闭式；仍须在原始两式上独立计算残差。"
  standard_chain_v1:
    original_equations:
      - "D=1+(1-q)*alpha+q*(1-beta)"
      - "A=(1-q)*(alpha+alpha^2)"
      - "B=q*(2*beta-beta^2)"
      - "A=B=e*D/2"
    scalar_reduction_for_E1:
      - "令 t=A=B，t_max=min(2*(1-q),q)。"
      - "alpha(t)=(-1+sqrt(1+4t/(1-q)))/2。"
      - "beta(t)=1-sqrt(1-t/q)。"
      - "D(t)=1+(1-q)*alpha(t)+q*(1-beta(t))。"
      - "h(t)=2t/D(t)，在 [0,t_max] 连续严格递增。"
      - "e_max(q)=h(t_max)。0<q<1 时当且仅当 e<=e_max(q) 可行，且解唯一。"
    uniqueness_certificate: >-
      在内部 t，h'(t)=2[D-tD']/D^2>0；代入 t=(1-q)(alpha+alpha^2)=q(2beta-beta^2)，
      D-tD'=1+(1-q){alpha-(alpha+alpha^2)/(1+2alpha)}
      +q(1-beta)+q(2beta-beta^2)/(2-2beta)>0。
      beta=1 的上端点用连续性承接，不在零分母处评价导数。
    boundaries:
      - "e=0 且 0<q<1：t=0，唯一 alpha=beta=0。"
      - "若 q<2/3，则 t_max=q、beta=1；若 q>2/3，则 t_max=2(1-q)、alpha=1；q=2/3 时 alpha=beta=1 且 e_max=1。"
      - "q=0 或 q=1 按 common.endpoint_identifiability；e>0 不可行。"
    E1_root_method:
      algorithm: "仅用 Decimal.sqrt 与确定性二分，在 t in [0,t_max] 求 h(t)-e=0；不得调用 E2 代码。"
      bracket: "e=0 直接返回下端；e=e_max 返回上端；0<e<e_max 时初始符号严格为负/正。"
      stopping: >-
        同时满足：(1) t 区间宽度<=1e-14；(2) 用当前 t_lo,t_hi 经单调 alpha(t),beta(t) 映射得到的
        root_alpha_span、root_beta_span 均<=1e-12；(3) 按17有效位序列化参数中点并重新解析为 reported_alpha/reported_beta；
        (4) reported_alpha 区间是 root_alpha 区间与 reported_alpha 点的最小外向凸包，reported_beta 同理，
        两个 reported span 均<=1e-12；(5) reported 回读值的原始残差 max(|A-eD/2|,|B-eD/2|,|A-B|)<=5e-12。
        不要求 reported 点落在 root interval；最多 300 次否则 NUMERICAL_FAILURE；
        不得以固定额外迭代数替代参数跨度证书。
    E2_independent_2d_back_substitution:
      algorithm: >-
        不使用 t、h(t)、E1 的求根/可行性函数或其输出 alpha/beta。
        外层以 alpha 为变量；内层在 beta in [0,1] 对
        q(2beta-beta^2)=(1-q)(alpha+alpha^2) 二分回代 beta；
        再对 R(alpha)=2(1-q)(alpha+alpha^2)-e[1+(1-q)alpha+q(1-beta(alpha))] 二分。
      bracket: >-
        alpha_lo=0；若 2(1-q)<=q 则 alpha_hi=1，否则以独立二分求
        (1-q)(alpha+alpha^2)=q 的 alpha_hi。R(alpha_lo)<=0；可行时 R(alpha_hi)>=0。
      stopping: >-
        独立 root_beta 括区间跨度<=1e-12，root_alpha 括区间跨度<=1e-12；按17有效位序列化各 root 中点并回读；
        root 区间与各 reported 点的最小外向凸包 reported_alpha/reported_beta span 均<=1e-12；reported 回读值原始三残差均<=5e-12；
        每层最多 300 次，否则 NUMERICAL_FAILURE。不得要求 reported 点属于 root interval，也不得只凭外层函数残差或固定额外迭代停止。
      existence_diagnostic: "必须回报 alpha/beta 最终括区间、跨度、alpha 外括区间端点 R、每次 inner bracket 合法性及最终原始残差；括区间不成立时不得改算法或投影。"

numeric_policy:
  validation_and_feasibility:
    - "JSON q/e 本来就是字符串；直接以 Decimal(string) 解析，禁止先经 float。有效位数 s：移除符号与小数点后，从首个非零数字起计至末位；数值0的 s=1。"
    - "基础工作精度 p0=max(120,max_input_significant_digits+80)。所有分类与求根使用 Decimal localcontext，并对根号/四则的区间上下界采用 ROUND_FLOOR/ROUND_CEILING 定向舍入。"
    - "Decimal.sqrt 区间规则固定为：在当前目标精度 p 的 p+20 临时精度计算正确舍入值 r，再取 [r.next_minus(),r.next_plus()]，回到 p 位后分别 ROUND_FLOOR/ROUND_CEILING；后续区间四则同样向外舍入。不得把单个 sqrt 近似值当精确边界。"
    - >-
      alpha(t)、beta(t) 或独立回代的参数区间在每次完整映射后必须与已由定义严格证明的 codomain [0,1] 取集合交：
      lo=max(lo,0)，hi=min(hi,1)。这是将数值外包络与数学值域相交以收紧证书，保留所有真实函数值；不是裁剪/投影候选解，
      不得改变可行性分类、reported 值或方程。交集为空或 lo>hi 才返回 NUMERICAL_FAILURE。
    - "单次主语义可行性按 Decimal 精确代数比较，不用 epsilon 改分类。"
    - "替代链 e_max 先在 p0 位形成包含真实 e_max 的定向舍入区间 [L,U]：e<L 判可行，e>U 判不可行，e 恰为可精确识别的端点则按代数端点规则；其余不稳定时精度依次增加80位，最多 p0+800。"
    - "若达到 p0+800 后 e 仍落在 [L,U] 且无法以精确代数端点判定，返回 NUMERICAL_FAILURE；禁止 epsilon 分类、无限循环或任选一侧。"
    - "根号自变量若因运算误差落到域外，NUMERICAL_FAILURE；不得截到 0。"
  root_tolerance:
    bracket_width_absolute: "1e-14"
    alpha_parameter_span_absolute: "1e-12"
    beta_parameter_span_absolute: "1e-12"
    E1_original_residual_absolute: "1e-12"
    E2_original_residual_absolute: "2e-12"
    max_iterations: 300
  cross_implementation_validation:
    alpha_beta_absolute: "5e-11"
    e_max_absolute: "5e-12"
    status_and_free_parameters: "exact"
  serialization:
    significant_decimal_digits: 17
    round_trip_original_residual_absolute: "5e-12"
    negative_zero: "必须规范化为 0"
    bracket_certificate: >-
      E1/E2 均须在 diagnostics.notes 以如下12个固定键值字符串记录：
      root_alpha_lo/root_alpha_hi/root_alpha_span/root_beta_lo/root_beta_hi/root_beta_span/
      reported_alpha_lo/reported_alpha_hi/reported_alpha_span/reported_beta_lo/reported_beta_hi/reported_beta_span。
      root 区间是各自算法对真实根的外向区间；reported 区间是对应 root 区间与17有效位实际回读点的最小外向凸包。
      E2 另须验证 E1 response 的 reported 值和12项证书，再独立生成自己的同构12项证书；不得把 reported 点宣称为精确根。
  immutable_rule: "E1/E2 不得放宽、改成相对容差、按样例调容差或把失败改为可行；如需改变必须 DECISION_REQUIRED。"

boundary_and_error_behavior:
  - "缺字段、额外字段、非法枚举、重复 process_id、非法 decimal、域外 q/e：FAILED_VALIDATION，整 envelope 不产生部分结果。"
  - "数学上无解：结果 status=INFEASIBLE；alpha=beta=null；保留 q,e,e_max 与严格不等式诊断；退出码仍为 0，因为这是有效数学结果。"
  - "端点不可识别：NONIDENTIFIABLE_FAMILY；只把自由参数置 null；不得抽选代表解。"
  - "括区间、迭代或残差失败：overall_status=NUMERICAL_FAILURE，进程非零；禁止返回最后迭代冒充结果。"
  - "canonical 请求必须恰有 A/B/C 且绑定指定 parameter_id；否则 FAILED_VALIDATION。"
  - "direct_values 可接受任意 process_id 和合法 q,e，包括 E 测试；不得把 direct E 结果标为 canonical。"

