  rules:
    - "外部 fixture 只供 E1 与 runner 测试；E2 不得读取，E2 仅用本任务包 E2_embedded_oracles。"
    - "exact 字段优先用整数比/根式表达，可由 Fraction/Decimal 独立复算。"
    - "近边界用十进制输入验证分类与残差，不用 fixture 输出替代 canonical 程序运行。"
    - "任何修改预期值、删除样例或降低精度均须升级。"

E2_embedded_oracles:
  access_rule: "本小节是 E2 唯一 oracle；E2 禁止读取外部 oracle fixture。"
  cases:
    - id: "single_endpoint_q0"
      semantics: "single_test_unconditional_v1"
      q: "0"
      e: "0"
      expected: {status: "NONIDENTIFIABLE_FAMILY", alpha: "0", beta: null, free_parameters: ["beta"]}
    - id: "single_exact_internal"
      semantics: "single_test_unconditional_v1"
      q: "0.25"
      e: "0.25"
      expected: {status: "UNIQUE_SOLUTION", alpha_exact: "1/6", beta_exact: "1/2", e_max_exact: "1/2"}
    - id: "single_above_boundary"
      semantics: "single_test_unconditional_v1"
      q: "0.25"
      e: "0.50000000000000000001"
      expected: {status: "INFEASIBLE", e_max_exact: "1/2"}
    - id: "chain_endpoint_q1"
      semantics: "standard_chain_v1"
      q: "1"
      e: "0"
      expected: {status: "NONIDENTIFIABLE_FAMILY", alpha: null, beta: "0", free_parameters: ["alpha"]}
    - id: "chain_exact_internal"
      semantics: "standard_chain_v1"
      q: "0.5"
      e: "0.5"
      expected: {status: "UNIQUE_SOLUTION", alpha_exact: "1/2", beta_exact: "1/2", D_exact: "3/2", N_FP_exact: "3/8", N_FN_exact: "3/8"}
    - id: "chain_global_boundary"
      semantics: "standard_chain_v1"
      q_exact: "2/3"
      e: "1"
      expected: {status: "UNIQUE_SOLUTION", alpha_exact: "1", beta_exact: "1", D_exact: "4/3", e_max_exact: "1"}
      oracle_scope: "EXACT_FRACTION_ALGEBRA_ONLY_NOT_PUBLIC_API"
      execution_rule: "必须用 Fraction(2,3) 做隔离代数恒等式验证；禁止转成有限 Decimal、禁止构造 API request/response、禁止调用 public API 或主 solver。任意有限十进制近似 q 下 e=1 都应按该精确 q 判为 INFEASIBLE。"
    - id: "chain_qhalf_above_boundary"
      semantics: "standard_chain_v1"
      q: "0.5"
      e: "0.76393202250021030360"
      expected: {status: "INFEASIBLE", e_max_exact: "3-sqrt(5)"}
    - id: "chain_near_degenerate_q001"
      semantics: "standard_chain_v1"
      q: "0.01"
      e: "0.01980390195507347100477"
      expected:
        status: "UNIQUE_SOLUTION"
        alpha_span_max: "1e-12"
        beta_span_max: "1e-12"
        cross_channel_alpha_beta_max_abs: "5e-11"
      oracle_scope: "PUBLIC_API_NUMERICAL_REGRESSION_NOT_FORMAL_RESULT"
      execution_rule: "不得把参考手算 beta 写为期望；只验两通道各自括区间证书、原始残差及跨通道容差。"
  evaluation: "Fraction 处理有理数，Decimal.sqrt 在 precision>=80 独立计算；不得调用 E1、t/h 求根或外部 fixture。带 EXACT_FRACTION_ALGEBRA_ONLY_NOT_PUBLIC_API 的案例不得进入公开 API 测试。"

