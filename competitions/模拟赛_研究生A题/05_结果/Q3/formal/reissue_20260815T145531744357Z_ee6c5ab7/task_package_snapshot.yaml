# ============================================================================
# 5. 统计程序（Bootstrap §14.3/D-04 冻结）
# ============================================================================
statistics:
  tier1_primary_estimand: "每 K 的 E[T]（日历小时→/24 天；P044）"
  comparison_family_tier1: "全部 21 个两两 K 配对对比（CRN 配对差 DeltaT=T(k1)-T(k2)）"
  method: "paired batch-level bootstrap；B=10000；族水平 95%"
  bonferroni_tier1: "m=21；alpha_each=0.05/21；双侧；边缘 percentile 界 0.05/42 与 1-0.05/42"
  tier2_analysis: "同 21 对配对比较（独立运行；无主推荐身份；不与 Tier 1 混池）"
  recommendation_rule:
    k_star: "argmin_k mean(T_K)"
    co_best: "与 k* 配对 CI 含 0 的全部 K"
    strong_recommendation: "仅当 k* 相对其余全部 K 的 CI 完全 <0；否则报告 k* + co-best"
    wording_limit: "最优声明限于七个 K 与冻结候选政策集内；禁止全局最优；禁止预设 K=12 最优"
  quality: "S/PL/PW 独立报告；跨 K 按 accepted 质量分离以 C06 验证；PL/PW 稀有事件池化 20000 台/单元，x=0 → 单侧 exact CP 95% 上界 1-0.05^(1/20000)；禁写 true probability=0"
  yxb: "分母 = K（B10/P048；引擎 shift_count×shift_length_h 口径）；分子为两队合并的实际运行片段"

