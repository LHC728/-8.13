# ============================================================================
frozen_event_engine_semantics:
  - id: SEM-01
    text: "大厅有两个驻留测试台；装置从进入直到最终通过/退出持续占一个台位，场外无额外缓冲位。"
    source: "问题契约 §1.1；parameters.csv P001"
  - id: SEM-02
    text: "A/B/C/E 四类专业组及专用设备各一套，同类资源容量均为 1。"
    source: "问题契约 §1.1；parameters.csv P002-P005"
  - id: SEM-03
    text: "同一装置的 A/B/C 可在不同专用资源上同时测试；同一道工序不能与自身重叠。"
    source: "问题契约 §1.1；02_H1 §1"
  - id: SEM-04
    text: "E 必须等 A/B/C 均得到有效通过结果后才可开始，且不与该装置的 A/B/C 并行。"
    source: "问题契约 §1.1；02_H1 §1"
  - id: SEM-05
    text: "首次异常只释放该工序自身的重测，不取消其他已运行工序；重测可与不同工序并行。"
    source: "问题契约 §7.2；02_H1 §1"
  - id: SEM-06
    text: "重测并行执行，不等待本装置其他工序；E 仍等全部 A/B/C 通过。"
    source: "问题契约 §7.2；02_H1 §1"
  - id: SEM-07
    text: "终端退出仅由『同一道工序的完整重测再次异常』触发（第二次有效异常，同工序）。"
    source: "问题契约 §7.3；02_H1 §1；parameters.csv P036"
  - id: SEM-08
    text: "同刻事件先批量结算全部已完成任务，再执行终端退出与取消；改变日志插入顺序不得改变结局。"
    source: "问题契约 §7.4；02_H1 §3.1-3.2；小问依赖 §5.5"
  - id: SEM-09
    text: "退出仅取消尚未完成片段/任务；已完成任务的结果保留。"
    source: "问题契约 §7.4；02_H1 §3.4"
  - id: SEM-10
    text: "被取消或班界中断的片段无观测结果，且不增加有效尝试号。"
    source: "问题契约 §1.2；02_H1 §3.5；CR-V3.1/C10"
  - id: SEM-11
    text: "已运行片段（含完成、重测、取消、中断片段）计入时间/年龄/YXB 账本接口；G2 未启用完整随机寿命，但账本接口必须记录运行片段时长。"
    source: "问题契约 §1.2；02_H1 §5；CR-V3.1/C10/C17"
  - id: SEM-12
    text: "effective_attempt_no 仅在有效完成的测试上推进（初测 1，重测 2）；取消/中断片段不推进。"
    source: "问题契约 §7.8；02_H1 §2；CR-V3.1/C10"
  - id: SEM-13
    text: "重测 FCFS，不因身份插队。"
    source: "问题契约 §7.5；02_H1 §2"
  - id: SEM-14
    text: "任务逻辑 release_time 一经生成不因资源占用改写；故障/重启不改变 release_time；重测以首败完成时刻为 release_time。"
    source: "问题契约 §7.8；02_H1 §2"
  - id: SEM-15
    text: "Q3 跨班待重测保留首败记录、原 release_time 与 effective_attempt_no=2，可由下一班另一分队从头完整执行。"
    source: "问题契约 §7.9；parameters.csv P063；CR-V3.1/C11"
  - id: SEM-16
    text: "换班只更新 on_duty_squad，不清空全局就绪队列。"
    source: "问题契约 §7.9；02_H1 §4；parameters.csv P063"
  - id: SEM-17
    text: "squad_id 不进 FCFS 键、不进观测随机键、不进任务身份；只进物理执行片段日志。"
    source: "问题契约 §1.2、§7.9；parameters.csv P061/P063"
  - id: SEM-18
    text: "测试、换新—校准、复合周转均不可跨班暂停续做（non-preemptive within shift）。"
    source: "问题契约 §7.7；parameters.csv P062；CR-V3.1/C12"
  - id: SEM-19
    text: "恰好班末完成允许启动（start+duration == shift_end 合法）。"
    source: "问题契约 §7.7；02_H1 §4；parameters.csv P062"
  - id: SEM-20
    text: "班末剩余时间不足以完整完成的活动禁止启动（操作约束，非最优性定理）。"
    source: "问题契约 §1.3.3、§7.7；02_H1 §4"
  - id: SEM-21
    text: "t=0 初始状态显式冻结：首两台已到位并占台位、设备已校准、四资源空闲、全局队列空。"
    source: "问题契约 §1.1；02_H1 §1"
  - id: SEM-22
    text: "最后一台得到终端判定时停止计时，不计其运出（无意义末台运出不得发生）。"
    source: "问题契约 §1.1；K9 §2；CR-V3.1/C12"
  - id: SEM-23
    text: "主周转为同台位顺序运出 0.5h + 运入 0.5h = 1h；两台位可在同一运输阶段并行。"
    source: "问题契约 §1.1；parameters.csv P014/P015/P059"
  - id: SEM-24
    text: "0.5h 完整重叠周转仅为隔离配置小例，绝不与 1h 主周转混用。"
    source: "问题契约 §1.1；parameters.csv P049；CR-V3.1/C12"

# ============================================================================
# 5. 同刻事件顺序（机器可执行 A..I）
# ============================================================================
same_timestamp_event_order:
  description: >-
    单一事件时间戳上的确定性闭包。所有活动区间为半开 [start,end)。时间戳相等用精确有理数比较，禁止浮点 epsilon。
  steps:
    - step: "A"
      name: "settle_completed_activities"
      action: "对所有 scheduled_end == 当前时间戳的活动标记 COMPLETED，写入 end_time，并把已运行片段时长计入年龄/YXB 账本。"
    - step: "B"
      name: "materialize_observations"
      action: "对所有同刻完成的有效测试按脚本化结果物化观测（PASS/ABNORMAL）；装置首次到达 E 的联接时刻物化 D（not_created -> normal|problem，仅一次）。"
    - step: "C"
      name: "classify_outcomes"
      action: "对每个装置/工序分类：PASS -> 工序 PASSED；首次 ABNORMAL -> 释放该工序重测（effective_attempt_no=2，release_time=该失败完成时刻）；重测 ABNORMAL（第二次有效异常）-> 标记 device_exit。"
    - step: "D"
      name: "apply_device_exit"
      action: "对每个标记 device_exit 的装置统一置 EXITED 终态；在同刻所有完成先结算后再执行，保证不抢在同刻兄弟工序完成之前退出。"
    - step: "E"
      name: "cancel_unfinished"
      action: "对每个退出装置取消其全部未完成片段（运行中或就绪的其他工序任务）；取消片段无观测、不推进 effective_attempt_no、已运行部分计年龄/YXB。"
    - step: "F"
      name: "release_tasks"
      action: "释放：重测任务（attempt 2）、E 任务（A/B/C 全 PASSED 后）、周转任务（装置终态且存在下一台待入装置；末台不运出）。"
    - step: "G"
      name: "recompute_legal_candidates"
      action: "对每类资源取队列头（最小 FCFS 键），检查合法性：前置满足 + 资源空闲 + 台位可用 + 能在本班完整结束。"
    - step: "H"
      name: "dispatch_by_fcfs"
      action: "H1 无延迟：同时启动所有互不冲突、前置满足、能在本班完整结束的合法队首；记录 ACTIVITY_START，end=start+duration。"
    - step: "I"
      name: "liveness_closure"
      action: "若本时间戳无可执行项（无未来活动、无合法候选）但仍有未完成任务/未终态装置，跳到下一事件时间或下一班唤醒；日历空且任务全完成且装置全终态 -> SIMULATION_END。"
  liveness_audit:
    - "time_monotonic：duration>0，dispatch 只产生 end_time=now+duration>now 的未来事件；时间严格前进。"
    - "same_timestamp_closure_finite：结算/取消幂等、effective_attempt_no<=2、退出不可重复，闭包在有限步内终止，无零时无限环。"
    - "no_empty_calendar_with_unfinished：存在 READY 任务或非终态装置时，日历必非空或存在 next_shift_wake_up（C18）。"
    - "no_zero_time_loop：任何事件不得以相同状态在同一时间戳重复调度自身。"

# ============================================================================
# 6. 显式状态模型（不得藏状态于局部变量）
# ============================================================================
time_representation:
  rule: "G2 全部时长是 1/6h 的整数倍（2.5/2/2.5/3/0.5/0.5/0.5/1/3/2/3/1/6...）；用精确有理数（Fraction）表示与比较，禁止 float 与 epsilon。"
  half_open: "所有活动区间为 [start,end)。"

state_models:
  DEVICE_STATE:
    unique_id: "device_id（批次序号 1..N）"
    fields:
      - "device_id: int"
      - "entry_time: 有理数（1/2 号=0；k>=3 号=其周转运入完成时刻）"
      - "bay_id: 1|2（入场起至终态持续占用）"
      - "process_state[A|B|C|E]: {effective_attempt_no, first_failure_time|null, outcome_history[], process_status}"
      - "d_state: not_created|normal|problem（联接时生成一次）"
      - "terminal_state: PENDING|PASSED|EXITED"
      - "exit_reason: null|process_second_abnormal"
    process_status_enum: "NOT_STARTED|IN_PROGRESS|AWAITING_RETEST|PASSED"
    creation: "device 1/2 在 t=0 创建；device k>=3 在其台位周转运入完成时创建。"
    modification: "工序状态推进、D 生成、终态写入。"
    termination: "PASSED（E 通过）或 EXITED（同工序第二次有效异常）。"
  RESOURCE_STATE:
    unique_id: "resource_id in {A,B,C,E}"
    fields:
      - "resource_id: A|B|C|E"
      - "capacity: 1（常量）"
      - "status: IDLE|BUSY"
      - "current_activity: {task_id, device_id, process, attempt_no, start_time, end_time}|null"
    creation: "t=0 全部 IDLE（已校准）。"
    modification: "启动/完成/取消。"
    termination: "SIMULATION_END。"
  BAY_STATE:
    unique_id: "bay_id in {1,2}"
    fields:
      - "bay_id: 1|2"
      - "status: OCCUPIED_TESTING|OCCUPIED_TRANSPORT_OUT|OCCUPIED_TRANSPORT_IN|TERMINAL_OCCUPIED_UNTIL_STOP"
      - "current_device_id: int|null"
      - "transport_phase: none|out|in"
      - "turnover_profile: 1h_literal|0.5h_overlap（场景常量，隔离）"
    creation: "t=0 bay1=装置1、bay2=装置2，status=OCCUPIED_TESTING。"
    modification: "装置终态 -> 有下一台：transport_out(0.5h)->transport_in(0.5h)->新装置 OCCUPIED_TESTING；无下一台：TERMINAL_OCCUPIED_UNTIL_STOP。"
    termination: "SIMULATION_END。"
  TASK_STATE:
    unique_id: "task_id（稳定唯一）"
    fields:
      - "task_id: str"
      - "resource_id: A|B|C|E"
      - "device_id: int"
      - "process: A|B|C|E"
      - "effective_attempt_no: 1|2"
      - "release_time: 有理数（生成时冻结，不改写）"
      - "status: READY|RUNNING|COMPLETED|CANCELLED"
      - "outcome: PASS|ABNORMAL|NONE"
    creation: "首测：装置入台（A/B/C）或 A/B/C 全 PASSED（E）时释放；重测：首败完成时刻释放，attempt=2。"
    modification: "状态推进。"
    termination: "COMPLETED（有效测试完成）或 CANCELLED（装置退出取消未完成片段）。"
  TEST_ATTEMPT_STATE:
    unique_id: "attempt_id"
    fields:
      - "attempt_id: str"
      - "device_id, process, effective_attempt_no"
      - "status: SCHEDULED|RUNNING|COMPLETED|CANCELLED"
      - "start_time, end_time|null"
      - "outcome: PASS|ABNORMAL|NONE"
      - "result_squad_id: 1|2（物理执行片段记录者）"
    creation: "任务启动时。"
    modification: "完成（写结果）或取消（无结果）。"
    termination: "COMPLETED/CANCELLED。"
  SHIFT_CALENDAR_STATE:
    unique_id: "shift_index"
    fields:
      - "scenario: q2_single_shift|q3_two_shift|isolated_small_case"
      - "shift_index: int"
      - "shift_start, shift_end（半开）"
      - "on_duty_squad: 1|2"
      - "next_shift_wake_up_time: 有理数|null"
    creation: "t=0 冻结初态；Q3 两班各 K h 后停工 24-2K h。"
    modification: "换班只改 on_duty_squad，不清空队列。"
    termination: "SIMULATION_END。"
  QUEUE_ENTRY:
    unique_id: "queue_id(per resource) + task_id"
    fields:
      - "queue_id: A|B|C|E"
      - "task_id"
      - "fcfs_key: (release_time, device_id, process_order, effective_attempt_no)"
      - "status: WAITING|DISPATCHED|REMOVED"
    creation: "任务释放。"
    modification: "派工/取消。"
    termination: "DISPATCHED 或 REMOVED。"
  EVENT:
    unique_id: "event_id（单调递增，确定性）"
    fields:
      - "event_id: int"
      - "event_time: 有理数"
      - "event_type: ACTIVITY_START|ACTIVITY_COMPLETE|OBSERVATION_MATERIALIZED|D_CREATED|TASK_RELEASE|DEVICE_EXIT|TASK_CANCEL|TURNOVER_OUT_START|TURNOVER_OUT_COMPLETE|TURNOVER_IN_START|TURNOVER_IN_COMPLETE|SHIFT_CHANGE|WAKE_UP|DEVICE_TERMINAL|SIMULATION_END"
      - "payload: {device_id, process, effective_attempt_no, resource_id, bay_id, squad_id, outcome, cancel_reason, ...}"
    creation: "同刻闭包/派工产生。"
    termination: "SIMULATION_END。"
  LOG_RECORD:
    unique_id: "log_record_id（seq，单调，确定性）"
    fields:
      - "seq: int"
      - "event_time: 有理数（序列化为 decimal 字符串或分数字符串）"
      - "event_type: enum（同 EVENT）"
      - "device_id, process, effective_attempt_no, resource_id, bay_id, squad_id"
      - "attempt_start_time, attempt_end_time|null"
      - "outcome: PASS|ABNORMAL|NONE"
      - "cancel_reason: NONE|DEVICE_EXIT|SHIFT_INTERRUPT|..."
      - "release_time（释放类事件）"
      - "d_state（D_CREATED 事件）"
      - "terminal_state, terminal_reason（终态事件）"
      - "elapsed_hours（该片段运行时长，供年龄/YXB）"
    creation: "每个事件物化一条日志记录；append-only 不可变。"
    termination: "SIMULATION_END。"
  note: "所有可观察状态必须物化为上述显式对象或日志记录；禁止把台位/资源/工序关键状态只放在函数局部变量中。"

# ============================================================================
# 7. FCFS 键冻结
# ============================================================================
fcfs_key:
  canonical_tuple: "(release_time, device_id, process_order, effective_attempt_no)"
  source: "问题契约 §1.3.2、§7.5；02_H1 §2；CR-V3.1/C11"
  component_spec:
    release_time: "精确有理数；任务生成时冻结，不改写；重测=首败完成时刻。比较用精确有理数。"
    device_id: "批次序号（1..N），按入台顺序；device 1/2 在 t=0 预置，device k>=3 为第 k 台入台。全序递增。"
    process_order: "固定全序 A < B < C < E。同类资源队列内 process 恒定，此分量只影响跨资源 canonical 事件日志排序，不影响派工结果。"
    effective_attempt_no: "正整数；1 < 2。"
  comparison: "字典序：先 release_time（精确有理数），再 device_id（int），再 process_order（A<B<C<E），再 effective_attempt_no（int）；取最小键。"
  device_id_derivation: "批次语义（P037/P040 固定批次）+ 首两台预置（问题契约 §1.1）+ K9 手算使用 装置1/2/3 三处一致支撑；判断为可完全规格化，非未定义。"
  squad_id_exclusion: "squad_id/execution_no/restart_no 均不进键。"
  status: "FROZEN（无开放决策项）"

