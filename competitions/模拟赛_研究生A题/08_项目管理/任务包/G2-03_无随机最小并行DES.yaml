    - "CP-SAT 与 DES 属异源计算范式：DES=事件状态转移/event calendar；CP-SAT=变量 + precedence + capacity + calendar constraints。"
    - "不得共享：event transition function、dispatch loop、queue mutation logic、DES scheduler implementation。"
    - "允许共享只读：fixture data、durations、resource capacities、frozen semantics constants。"

# ============================================================================
# 9a. 依赖锁定契约（人工 Gate OPT-A 落文；版本来自实际环境机械探测）
# ============================================================================
checker_optional_dependencies:
  ortools:
    purpose: "CR-V3.1/C08 deterministic CP-SAT oracle only"
    version: "9.15.6755"
    main_des_dependency: false
    formal_large_run_dependency: false
    python_version: "3.12.10"
    import_test: "python -c \"from ortools.sat.python import cp_model; print('ORTOOLS_CP_SAT_OK')\""
    install_command: "python -m pip install \"ortools==9.15.6755\""
    provenance_note: "安装后以 pip freeze 记录与 ortools 及其新引入直接/传递依赖相关的条目；不得安装其他新软件包。"
    upgrade_policy: "禁止 rc/beta/alpha/nightly/git HEAD/unpinned；版本变更须走变更控制。"
    runtime_version_guard: "CP-SAT oracle 启动时检查 ortools.__version__ == '9.15.6755'，不一致则显式 FAIL（与 cp_sat_oracle_spec.release_independence.runtime_version_guard 一致）。"
    boundary: "CP-SAT 仅限确定性 scripted fixtures；禁止 random defect/observation/lifetime、equipment stochastic failure、keyed RNG、100 devices；随机寿命属 G3。"

# ============================================================================
# 9b. CP-SAT oracle 冻结建模边界（未来 oracle 必须遵守；异源、只读共享）
# ============================================================================
cp_sat_oracle_spec:
  input_same_as_fixture:
    - "device IDs"
    - "process durations"
    - "capacities"
    - "scripted outcomes"
    - "shift calendar"
    - "turnover mode"
    - "exogenous release times（仅限 fixture 初始条件直接给定者；内生 release 一律由 CP-SAT 独立推导，见 release_independence）"
  must_represent_independently:
    - "1. A/B/C/E intervals"
    - "2. A/B/C/E 各容量 1"
    - "3. bay capacity = 2"
    - "4. A/B/C 可以同装置并行"
    - "5. E 必须等待 A/B/C flow pass"
    - "6. retest release after first abnormal"
    - "7. second abnormal causes exit"
    - "8. canceled/not-generated downstream task 不应强制存在"
    - "9. shift-window feasibility"
    - "10. no-cross-shift constraint"
    - "11. exactly-at-shift-end allowed"
    - "12. turnover occupancy"
    - "13. K9 pending retest across shift"
    - "14. FCFS canonical rule 在 fixture 中造成的固定顺序约束"
  determinism_only:
    - "只允许确定性 scripted fixtures"
    - "禁止 random defect / random observation / random lifetime / equipment stochastic failure / keyed RNG / 100 devices"
    - "设备随机寿命属于 G3，不得提前进入"
  comparison_output:
    - "每个适用 fixture 形成 fixture_id + hand_timeline + des_timeline + cp_sat_timeline"
    - "逐项比较：task existence、start_time、finish_time、resource、bay、attempt number、terminal time、makespan"
    - "多个同样合法的 CP-SAT 解不得仅因内部任务排列不同判 FAIL；只比较冻结 fixture 真正要求唯一的量"
    - "若 C08 fixture 要求唯一 canonical FCFS timeline，CP-SAT 必须编码该 FCFS 顺序，再逐事件精确比较"
  release_independence:
    exogenous_release:
      definition: "只有真正由 fixture 初始条件直接给定的时间才允许作为 CP-SAT oracle 输入。"
      allowed_inputs:
        - "t=0 已在大厅的首两台装置"
        - "fixture 明确给定的初始 availability"
        - "fixture 明确给定的 shift calendar"
    endogenous_release:
      definition: "由前序活动完成、scripted outcome、device terminal state 推导出的后续 task release_time，禁止由 DES/event_log/DES timeline/DES scheduler output 提供给 CP-SAT；CP-SAT 必须独立推导。"
      must_derive_independently:
        - "1. retest release_time"
        - "2. E initial-test release_time"
        - "3. turnover-completion 后产生的 A/B/C initial-task release_time"
        - "4. 任何由前序活动完成、scripted outcome、device terminal state 推导出的后续 task release_time"
      derivation_inputs: "fixture primitive inputs、scripted outcomes、durations、precedence、resource constraints、bay constraints、turnover constraints、shift/calendar constraints、frozen flow semantics"
    retest_release_formula: "对某工序 j 的第一次有效测试异常：retest_release_time(j) = finish_time(first_effective_attempt(j))；finish_time 取自 CP-SAT 自身变量，不得读取 DES 提供的 retest release。"
    e_release_formula: "E_release_time 当且仅当 A/B/C 三条 flow 均已获得 PASS 后形成；其时间由 CP-SAT 从自己的 A/B/C 时间变量和 scripted outcomes 独立导出；不得将 DES 算出的 E.release_time 作为 oracle input。"
    turnover_release_formula: "新装置 A/B/C initial release 若由 turnover 完成产生，必须由 CP-SAT 自己的 turnover interval 结束时刻导出。"
    no_des_derived_input:
      rule: "CP-SAT oracle 求解输入阶段 MUST NOT READ：des_event_log、des_timeline、DES-computed release_time、DES-computed start_time、DES-computed finish_time、DES-computed queue order after dynamic release、DES terminal state。"
      comparison_only: "DES timeline 只允许在 CP-SAT 求解完成之后进入 comparison stage，作为被比较对象。"
    shared_inputs_only: "DES 与 CP-SAT 只允许共享：fixture_id、primitive fixture data、device IDs、frozen durations、resource capacities、bay capacity、scripted outcomes、shift calendar、turnover mode/duration、frozen FCFS key definition、frozen semantic constants。禁止共享任何由主 DES 执行后产生的派生状态。"
    fcfs_independent_encoding:
      rule: "CP-SAT 必须独立编码 canonical FCFS 键 (release_time, device_id, process_order, effective_attempt_no)，其中 release_time 必须使用 CP-SAT 自己独立推导出的 release_time；禁止直接读取 DES 排好的 queue order；若两个任务的动态 release_time 需由前序事件决定，CP-SAT 必须从自己的约束系统导出。"
    oracle_role:
      primary_purpose: "验证冻结 deterministic DES / FCFS canonical timeline；不是用来寻找自由策略空间中的全局最优调度。"
      canonical_fcfs_fixture_rule: "对于要求 canonical FCFS timeline 的 fixture，必须编码冻结的 FCFS 顺序约束；不得因为 CP-SAT 找到 makespan 更短但违反冻结 FCFS 策略的解就判 DES FAIL。"
      comparison_target: "task existence、release、start、finish、resource、bay、attempt、terminal time、makespan——均在相同冻结策略语义下比较。"
    runtime_version_guard:
      rule: "未来 CP-SAT oracle 启动时必须检查 ortools.__version__ == '9.15.6755'；不一致则显式 FAIL，禁止静默使用其他版本。"
      main_des_ortools: "主 DES 不得 import ortools。"
  integer_time_scaling:
    rule: "CP-SAT 内部只使用整数 tick；输出按冻结规则反序列化；禁止 float 作为 canonical event time。"
    scale_derivation: >-
      机械求取：G2 全部确定性时长均为 1/6h 的整数倍（测试 2.5/2/2.5/3h、校准 30/20/20/40min、
      运出/运入 0.5h、周转 1h 或 0.5h、班长 12h 与 q3 K∈{9,9.5,...,12}h）。
      最小公共时间单位 = 10min = 1/6h（20min/40min 校准决定了 10min 粒度；无更细确定性粒度）。
      ticks_per_hour = 6；1 tick = 10min。禁止随意写 scale=100 或 scale=1000。
    serialization: "tick 数按冻结规则反序列化为 decimal/分数字符串，禁止 float。"
    verification: "以 parameters.csv P006-P015/P038/P041/P049/P059 机械验证全部时长为 10min 整数倍。"

# ============================================================================
# 10. 主/检查器隔离与 event_log 契约
# ============================================================================
event_log_contract:
  principle: >-
    主 DES 只输出不可变 event_log；未来 checker 只凭 event_log + 冻结 config + scripted fixture + parameters
    独立重算，绝不 import 主状态机。主 DES 不输出『只有最终 T』；event_log 必须足以复算以下全部量。
  must_support_independent_recompute:
    - "bay occupancy（每台位 [0,T) 的占用/运输状态覆盖）"
    - "A/B/C/E 资源占用（每资源 [0,T) 的 IDLE/BUSY 覆盖）"
    - "task start/end（每任务每片段）"
    - "release_time（释放事件显式记录，含跨班不变断言）"
    - "attempt number（effective_attempt_no）"
    - "test outcome（PASS/ABNORMAL）"
    - "cancel reason（DEVICE_EXIT/SHIFT_INTERRUPT/...）"
    - "shift boundary（SHIFT_CHANGE 事件 + 半开区间）"
    - "turnover（OUT_START/OUT_COMPLETE/IN_START/IN_COMPLETE + 台位）"
    - "device terminal state（PASSED/EXITED + terminal_reason）"
    - "T（最后一台终态判定时刻）"
    - "YXB 账本缝（每测试片段 elapsed_hours 按组分 A/B/C/E 累计；年龄账本缝同源）"
  immutability: "event_log 为 append-only；每 run 冻结后不可覆盖；以 SHA-256 进入 hash inventory。"

# ============================================================================
# 11. schema / manifest 草稿
# ============================================================================
schemas_and_manifest_draft:
  input_config_schema:
    id: "des_config_v1（草稿）"
    fields:
      - "schema_version: const des_config_v1"
      - "scenario_id: 非空稳定字符串"
      - "scenario: q2_single_shift|q3_two_shift|isolated_small_case"
      - "batch_size: 正整数（夹具 1..4；正式 100）"
      - "shift_length_h, shifts_per_day（q2 12h/1；q3 K/2；isolated 用足够长单班）"
      - "durations: {A,B,C,E} 有理数（2.5/2/2.5/3）"
      - "transport_out_h, transport_in_h, turnover_profile: 1h_literal|0.5h_overlap"
      - "deterministic_initial_state: {preloaded_devices:[1,2], all_calibrated:true, queues_empty:true}"
      - "random_enabled: false（固定）"
      - "key_schema_version: P061 key_schema_v1（占位，G2 不启用随机流）"
  scripted_outcome_schema:
    id: "scripted_outcomes_v1（草稿）"
    fields:
      - "fixture_id: F1..F12"
      - "devices: [{device_id, real_state:{A,B,C}, d_state:{normal|problem|not_created}}]"
      - "outcomes: [{device_id, process, effective_attempt_no, outcome: PASS|ABNORMAL}]"
      - "calendar, turnover_profile"
    rule: "真实状态与观测结果均脚本化，禁止 RNG；不得以 RNG 伪造夹具期望。"
  event_log_schema:
    id: "des_event_log_v1（草稿）"
    envelope: "schema_version + scenario_id + records[]"
    record_fields: "见 state_models.LOG_RECORD；event_time 用十进制字符串或分数字符串，禁止 float。"
    ordering: "records 按 seq 升序；确定性，不依赖容器遍历或哈希顺序。"
  run_manifest_schema:
    id: "des_run_manifest_v1（草稿）"
    fields:
      - "run_id: UTC YYYYMMDDTHHMMSSffffffZ_ + 8 位 secrets.token_hex(4)"
      - "scenario_id, config_hash, event_log_hash, scripted_fixture_hash, parameters_hash"
      - "task_package_ref, registry_version, code snapshots"
      - "metrics: {T, S, PL, PW, YXB_A..YXB_E}"
    rule: "run_id 冲突则失败不覆盖；manifest 不记录自身 hash（其 hash 在 file_hashes.sha256）。"
  check_placeholder_interface:
    id: "des_check_v1（预留，本包不实现）"
    contract: "checker 读 event_log + config + scripted fixtures + parameters；独立重算台位/资源占用、时序、release_time、attempt、outcome、cancel、班界、周转、终态、T、YXB；禁止 import main_model 状态机。"
    status: "RESERVED_INTERFACE"
  immutable_evidence_root:
    root: "05_结果/G2/run_<immutable_run_id>/"
    layout: "run_manifest.json + commands.json + file_hashes.sha256 + frozen/{task_package, parameters.csv, schemas, fixtures} + event_log.jsonl + metrics.json"
  hash_inventory:
    rule: "file_hashes.sha256 小写 SHA-256、两个空格、POSIX 相对路径、按路径 Unicode code-point 升序、LF；排除自身；不列目录。"

# ============================================================================
# 12. 所有权草稿（最小，不过度设计）
# ============================================================================
ownership_draft:
  layout:
    engine: "04_代码/main_model/des/deterministic_des_v1.py（状态机 + 事件日历 + 同刻闭包 + 派工）"
    state_models: "04_代码/main_model/des/state_models_v1.py（显式状态对象与常量枚举）"
    fixtures: "04_代码/tests/fixtures/des_fixtures_F1_F12_v1.json（脚本化夹具 + K9 期望）"
    engine_tests: "04_代码/tests/test_des_main_v1.py"
    schemas: "04_代码/src/schemas/des_config_v1.schema.json / des_event_log_v1.schema.json / des_run_manifest_v1.schema.json（D 冻结的共享只读 schema）"
    checker: "04_代码/checker/des_checker_v1.py（G2-04 任务包，本包不写）"
    runner: "04_代码/scripts/run_g2_03_v1.py（G2-04 任务包，本包不写）"
  role_separation:
    engine_implementer: "只实现冻结状态机与夹具，不得实现 checker、不得新增依赖、不得写正式结果。"
    checker_implementer: "G2-04；只读 event_log/config/fixtures/parameters，不得 import 主模型。"
    d_acceptance: "语义验收 + C08-C12/C18 范围内结论强度；不得自行改容差或补数字。"
  constraints:
    - "仅 Python 标准库；不得新增依赖（含 CP-SAT，见 cp_sat_dependency_decision）。"
    - "main_model 与 checker 分目录、分代码路径；共享只读参数与 schema，不共享核心状态转移/可行性/指标函数。"

# ============================================================================
# 13. 建议的 G2 拆分判断
# ============================================================================
proposed_split:
  judgement: "ACCEPTABLE"
  g2_03: "确定性并行 DES 内核 + F1-F12（含 K=9 跨班时间线）+ C08（手算部分）/C09/C10/C11/C12/C18 + event_log 契约 + schema 草稿。"
  g2_04: "独立日志重放 checker + C06 最小质量分离 + C16 键骨架 + C17 指标/账本复算 + C19 隔离强制 + C20 故障注入 + C21 复现证据 +（可选）CP-SAT oracle 的 G2-04 侧辅助验证（首选归属 G2-03 validation/oracle）。"
  rationale: >-
    引擎先产出确定性 event_log 与手算夹具证据，checker 后独立重放；职责与证据链清晰，不把全部剩余 G2 塞进一个巨型任务。
    若人工 Gate 认为 G2-03 仍过大，可再拆出『夹具/手算事件表预签字』为独立前置子任务，但当前拆分已可接受。

# ============================================================================
# 14. 决策请求清单
# ============================================================================
decision_required: []
resolved_decisions:
  - id: "CP_SAT_DEPENDENCY_RULING_OPT_A"
    resolution: "OPT-A_APPROVED（2026-08-14 Human Gate）"
    outcome: "OR-Tools 9.15.6755 仅作为 C08 独立 CP-SAT oracle 专用依赖；主 DES stdlib-only；CR-V3.1/C08 未修改。"
    note: "FCFS 键、K9 夹具、班界语义、周转/台位占用、脚本化异常 vs 有效尝试、末台终止均已冻结，无需决策。"

# ============================================================================
# 15. 偏差记录
# ============================================================================
deviations:
  - "调度所称『事件引擎语义 items 1-26』实际逐条展开为 24 条独立语义；本包冻结全部 24 条（frozen_event_engine_semantics SEM-01..SEM-24）。"
  - "本包已冻结为 G2-03-SPEC-V1.0，不包含 dispatches / allowed_read_paths / allowed_write_paths / exact_cli 等派单级字段；这些在实现 Gate 补。"
  - "V0.2（2026-08-14）：人工 Gate 裁决 CP-SAT 依赖为 OPT-A（OR-Tools 9.15.6755 仅 C08 独立 oracle 专用）；CP-SAT 依赖开放决策项关闭；新增 checker_optional_dependencies 与 cp_sat_oracle_spec（含整数时间刻度机械求取：1 tick=10min=1/6h）。"
  - "V1.0（2026-08-14）：人工 Gate 冻结本包；唯一语义修正为 cp_sat_oracle_spec.release_independence（外生/内生 release 区分、禁读 DES 派生输入、FCFS 独立编码、版本运行时保护）。"
  - "本包不修改 CURRENT_STATE.md、CHANGELOG.md、问题契约、检查注册表、parameters.csv、03_模型/**、04_代码/**、05_结果/**、G2-01/G2-02 任务包或任何证据。"

must_not_change:
  - "问题契约 §7 已冻结状态机输入、02_H1 同刻事件顺序与班界周转语义。"
  - "FCFS 键元组与 device_id=批次序号方案。"
  - "K9 手算时间线与其验收量（T=14、S=3、PL=0、PW=0、YXB 四值）。"
  - "仅 Python 标准库；不得新增依赖（OR-Tools 9.15.6755 例外：仅 C08 独立 CP-SAT oracle 专用，见 checker_optional_dependencies）。"
  - "不得把班末禁启写成弱支配定理、不得把手算数写成正式结果、不得宣称 C06/C16/C17/C19/C20/C21 完成。"

no_pass_claim_yet: >-
  本包 V1.0 冻结只表示语义与接口可执行；CR-V3.1/C08-C12/C18 尚需引擎实现、夹具逐事件一致与 D 语义验收；
  C08 的 CP-SAT 子项已获 OPT-A 裁决（OR-Tools 9.15.6755）但尚未实现。不构成任何检查 PASS 或 G2 Gate 通过。
