# ============================================================================
# 1. 冻结上游（本包不重定义，只绑定）
# ============================================================================
frozen_upstream:
  g3_spec_ref: "G3-SPEC-V1.0"
  g3_spec_hash: "b818f92a5fb90acd9bda6052e8e16d425452a73b9e6951b1eb3279fb4912e796"
  engine: "04_代码/main_model/g3/random_des_v1.py（accepted G3 引擎；本包不改其数学/状态语义）"
  key_schema: "key_schema_v1（G3 accepted；本包不修改，物理键不变）"
  quality_oracle: "04_代码/checker/g3_quality_oracle_v1.py（C06）"
  replay_checker: "04_代码/checker/g3_replay_checker_v1.py（C17）"
  accepted_h1_candidate:
    tau_pm: "198"
    unit: "h"
    note: >-
      198 h 在 q2_formal 之前冻结（S7 tuning accepted run 01b7c7e7 在 h1_tuning worlds 上选出，
      S8 holdout run 020bc637 在 g3_holdout 上未重调验证）。正式集合不得重调 tau_pm、不得重开粗网格、
      不得重开局部细化、不得在看到正式数据后选择 192/204 等其它阈值。
  no_pm_reference: "NO_PM_BEFORE_MANDATORY（不预防更换，但全部 240h 强制更换规则保持激活；独立政策参考，非 tau_pm=240）"

# ============================================================================
# 2. 正式情景族（Human Gate 冻结：2×2×2=8 单元）
# ============================================================================
formal_family:
  cartesian:
    A_observation_semantics:
      - id: "single_test_unconditional_v1"
        role: "字面/主观测语义（P060）"
      - id: "standard_chain_v1"
        role: "关键替代观测语义（P058；标准初测—触发重测链）"
    B_turnover:
      - id: "literal_1h"
        role: "主周转（P059；P014+P015 顺序共 1h）"
      - id: "full_overlap_0_5h"
        role: "敏感性周转（P049；同台位完全重叠 0.5h）"
    C_h1_policy:
      - id: "tau_pm_198"
        role: "冻结 H1 候选（tau_pm=198h）"
      - id: "NO_PM_BEFORE_MANDATORY"
        role: "独立政策参考"
  cells: "8 formal cells（2×2×2）；无其它 tau_pm 候选进入 q2_formal；不加入 H2"
  no_other_candidate: "TRUE"
  h2_excluded: "TRUE"
  label_to_token_mapping:
    single_test_unconditional_v1: "观测核 = P060 冻结闭式 (1-q)alpha=q beta=e/2：A/B/C 用 engine frozen_single_test_alpha_beta(q=P026-P028, e=P030-P032)；E 用 Q1 冻结 q_E=0.062593912407392898（accepted G2-02 4bb92eda single_test response）+ e_E=P033 经同一冻结闭式（与 G3 tuning/holdout runner 完全一致）"
    standard_chain_v1: "观测核 = P058 标准初测—触发重测链（accepted G2-02 run 4bb92eda standard_chain_v1 response：A/B/C alpha/beta + q_E=0.047150339332016366 + E alpha_E=0.010920932310648563 / beta_E=0.1185856135607714；engine observation_kernel 通用 alpha/beta 接口）"
    literal_1h: "engine turnover_profile = 1h_literal（P059；P014+P015 顺序 0.5h+0.5h=1h）"
    full_overlap_0_5h: "engine turnover_profile = 0.5h_overlap（P049；同台位完全重叠 0.5h；engine 已支持）"
    tau_pm_198: "tau_pm = Fraction(198)；engine 参数 tau_pm=198"
    NO_PM_BEFORE_MANDATORY: "engine 哨兵 NO_PM_BEFORE_MANDATORY（lifetime_regeneration_v1；永不预防，强制 240h 规则激活）"

# ============================================================================
# 3. 主/敏感性声明（正式数据前冻结）
# ============================================================================
primary_declaration:
  primary_q2_cell:
    observation: "single_test_unconditional_v1"
    turnover: "literal_1h"
    policy: "tau_pm_198"
  primary_policy_reference_cell:
    observation: "single_test_unconditional_v1"
    turnover: "literal_1h"
    policy: "NO_PM_BEFORE_MANDATORY"
  other_six_cells: "预声明稳健性/敏感性单元；必须完整运行并保留，但不得因其结果更有利而取代主单元"

# ============================================================================
# 4. 正式样本量与物理随机世界（Q2-FORMAL-DEC-01 / DEC-02 冻结）
# ============================================================================
formal_sample_size:
  batches_per_world_set: 200
  devices_per_batch: 100
  total_batches: "8 cells × 200 = 1600 complete batch simulations；每批 100 台 → 160 000 device-simulations"
  namespace: "q2_formal"
  master_seed: 3
  replicate_ids: "0..199 inclusive（恰 200 个 id；确定性冻结，不得事后增/减）"
  crn_pooling: "全部 8 单元在 CRN 配对有效处复用同一 200 个底层 replicate ids"
  forbidden_namespaces: ["development_unit", "pilot", "h1_tuning", "g3_holdout", "q3_formal"]
  no_post_hoc_repetition_change: "TRUE"
  resource_limit_conflict: >-
    若硬资源失败使 200 批不可能：STOP 并返回 Human Gate（Q2_FORMAL_NEW_DECISION_REQUIRES_HUMAN_GATE 或
    Q2_FORMAL_HARD_BUDGET_STOP_WAITING_FOR_HUMAN_GATE），绝不静默削减重复数。

# ============================================================================
# 5. CRN 规则（沿用 G3 key_schema_v1）
# ============================================================================
crn_rule:
  paired_worlds: >-
    固定 replicate_id 下，同一底层 canonical U world 在下列维度间复用：
    tau_pm_198 vs NO_PM；1h vs 0.5h 周转；single-test vs standard-chain 观测语义
    （在 accepted key_schema_v1 语义允许复用处）。不同配置按各自冻结概率参数对同一 U 做不同变换。
  forbidden_in_physical_keys: >-
    不得把 policy / strategy / turnover scenario / observation scenario / run_id /
    execution metadata 注入物理随机键，若会破坏意图 CRN 配对；G3 key_schema_v1 原样保留。

# ============================================================================
# 6. Q2 班历 / 初态
# ============================================================================
q2_calendar:
  N: 100
  shifts_per_day: 1
  shift_length_h: 12
  outside_shift: "全部测试、运输、换新与校准停止"
  initial_state:
    first_two_devices_in_bays: "TRUE"
    equipment_calibrated: "A/B/C/E 初态均已校准"
    age: 0
    generation: "按 accepted G3 语义初始化"
  terminal: "末台终端判定停止 T；不计最后运出"

# ============================================================================
# 7. 正式输出契约
# ============================================================================
formal_output_contract:
  per_batch_minimum:
    - "T_hours（精确有理数）"
    - "T_days = T_hours / 24"
    - "S（通过台数）"
    - "PL（带问题通过数/100）"
    - "PW（正常退出数/100）"
    - "YXB_A / YXB_B / YXB_C / YXB_E"
    - "preventive replacement counts（预防更换次数）"
    - "mandatory replacement counts（强制更换次数）"
    - "random failure counts（随机故障次数）"
    - "wasted/cancelled test fragments（作废/取消测试片段）"
    - "terminal GP/BP/GE/BE table（终局四格表）"
    - "empirical observation-error diagnostics（经验观测误差诊断）"
    - "lambda diagnostic where applicable（适用处 lambda 诊断）"
  per_batch_raw_metrics_preserved: "TRUE"
  across_200_batches_report:
    - "mean"
    - "standard error"
    - "median / P50"
    - "P90"
    - "predeclared confidence intervals where applicable"
  no_rounding_before_aggregation: "TRUE（聚合前不舍入源数据）"

# ============================================================================
# 8. 主估计量
# ============================================================================
primary_estimands:
  primary_optimization_estimand: "E[T]（字面观测 + 1h 周转主情景下）"
  primary_paired_policy_contrast: "Delta_T = T(tau_pm_198) - T(NO_PM_BEFORE_MANDATORY)；负值偏好 tau_pm_198"
  no_reselection: "正式运行不重选 tau_pm"
  interpretation_rule: >-
    若同时区间明确支持 Delta_T < 0，论文可表述：冻结 198h 候选在主情景下较无预防参考改善完成时间。
    若区间包含 0：报告两政策在预声明族水平下不可稳定区分。不重调、不发明其它阈值、不隐藏结果。
  quality_metrics: >-
    S / PL / PW 独立报告并按 accepted 质量分离/解析锚检查；不与 T 合成加权得分。

# ============================================================================
# 9. 正式统计程序（Q2-FORMAL-DEC-03 冻结；bootstrap 分析随机性冻结）
# ============================================================================
formal_statistical_procedure:
  method: "paired batch-level bootstrap + Bonferroni family-wise correction"
  bootstrap_B: 10000
  family_wise_confidence: "95%"
  resampling_unit: "一个完整 100-device 批次"
  analysis_stream:
    namespace: "q2_formal_analysis_bootstrap_v1"
    analysis_seed: 30003
    purpose: >-
      仅用于重采样 200 个完整配对批次索引；不影响 DES 物理 U、设备状态、观测、
      设备寿命、正式 replicate worlds；确定性可复现索引重采样实现。
  t_comparison_family（Q2-FORMAL-DEC-03 冻结，恰 4 个配对对比）:
    - id: "C1"
      role: "PRIMARY"
      observation: "single_test_unconditional_v1"
      turnover: "1h_literal"
      contrast: "Delta_T = T(tau_pm_198) - T(NO_PM_BEFORE_MANDATORY)"
    - id: "C2"
      role: "ROBUSTNESS"
      observation: "single_test_unconditional_v1"
      turnover: "0.5h_overlap"
      contrast: "Delta_T = T(tau_pm_198) - T(NO_PM_BEFORE_MANDATORY)"
    - id: "C3"
      role: "ROBUSTNESS"
      observation: "standard_chain_v1"
      turnover: "1h_literal"
      contrast: "Delta_T = T(tau_pm_198) - T(NO_PM_BEFORE_MANDATORY)"
    - id: "C4"
      role: "ROBUSTNESS"
      observation: "standard_chain_v1"
      turnover: "0.5h_overlap"
      contrast: "Delta_T = T(tau_pm_198) - T(NO_PM_BEFORE_MANDATORY)"
  bonferroni:
    alpha_family: 0.05
    m: 4
    alpha_each: 0.0125
    two_sided: "TRUE"
    marginal_bootstrap_coverage: "0.9875（每边缘 bootstrap CI 用 percentile 界 0.00625 / 0.99375）"
  t_interpretation:
    - "CI 完全 < 0：支持 tau_pm_198 更短 T"
    - "CI 包含 0：不可稳定区分"
    - "CI 完全 > 0：支持 NO_PM 更短 T"
    - "正式数据后绝不重调 tau_pm"
  no_opportunistic_all_pairs: "TRUE（不得扩展为全两两单元对比）"
  s_pl_pw_procedure（Q2-FORMAL-DEC-04 冻结）: >-
    S 及非稀有聚合量可用冻结批级重采样/报告程序；PL/PW 按稀有事件处理：
    每单元 N_total_devices = 200×100 = 20000。
    若 0 < x < 20000：报告精确 Clopper-Pearson 双侧 95% 区间；
    若 x = 0：报告单侧精确 CP 95% 上界（= 1 - 0.05^(1/20000)，机械计算，不手输舍入值），下界 0；
    同时报告批级均值与批级标准误；零稀有事件禁用普通正态区间。
    质量结论必须从属于 accepted C06 pathwise 相等 / 解析锚。

