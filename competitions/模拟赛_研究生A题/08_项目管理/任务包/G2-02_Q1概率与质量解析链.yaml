must_not_change:
  - "主/替代语义角色、公式、可行性条件、端点不可识别语义与 SD-G2-02-LAMBDA-ONCE。"
  - "canonical 参数 ID、上游绑定 run_id 与 hash、E q_E 只能由冻结公式导出的规则。"
  - "schema、fixture、测试期望、分类规则、求根/验证/序列化容差和停止规则。"
  - "三路线分文件互不 import、E1/E2 文件隔离、算法异源性、只用标准库和禁止联网。"
  - "不得新增默认值、裁剪/投影候选概率解、删除失败样本、发布正式数字或修改论文。"

mandatory_escalation:
  format: "事实—选项—影响—建议"
  template:
    事实: "最小复现、权威来源冲突或未定义行为；附实际输入、命令和错误。"
    选项: "最多两个候选处理；不得自行实施。"
    影响: "分别说明对公式、schema、fixture、检查 ID、重跑范围和结论的影响。"
    建议: "E 可提出有证据的建议，但决策留给 D/队伍。"
  triggers:
    - "权威文件、schema、fixture、上游输出或本任务包冲突。"
    - "遇到未定义状态，或需要选择新公式、根、默认、容差、精度、算法、依赖。"
    - "可行性、三路对拍、oracle、E1/E2 输出或残差不一致。"
    - "需要访问/修改允许路径外文件，或连续两次修复仍失败。"

completion_report_schema: |
  STATUS: PASS | PARTIAL | BLOCKED
  AGENT: name / agent_id
  MODEL_REQUEST: ...
  MODEL_SOURCE: explicit_override | inherited_unverified
  MODEL_RUNTIME_VERIFICATION: explicit_request_sent | inherited_unverified | tool_reported:...
  REASONING_EFFORT: ...
  LEVEL_ROLE: ...
  SCOPE: 实际读取/修改文件
  CHANGES: 机械描述
  RUNS: 实际命令、退出码、参数版本
  TESTS: 通过数、失败数及失败名称
  OUTPUTS: 文件、行数/尺寸/SHA-256
  CHILD_AGENTS_USED: NONE
  DEVIATIONS: NONE | ...
  WARNINGS: NONE | ...
  DECISIONS_MADE: NONE
