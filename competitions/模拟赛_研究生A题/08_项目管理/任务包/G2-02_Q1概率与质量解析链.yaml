evidence_package_contract:
  root: "05_结果/G2/run_<immutable_run_id>/"
  exact_layout:
    - "run_manifest.json"
    - "commands.json"
    - "file_hashes.sha256"
    - "frozen/G2-02_Q1概率与质量解析链.yaml"
    - "frozen/parameters.csv"
    - "frozen/q1_quality_v1.schema.json"
    - "frozen/q1_quality_oracles_v1.json"
    - "frozen/upstream/single_test_unconditional_v1/response.json"
    - "frozen/upstream/standard_chain_v1/response.json"
    - "frozen/upstream/file_hashes.sha256"
    - "frozen/code/04_代码/main_model/q1_quality_v1.py"
    - "frozen/code/04_代码/main_model/q1_routes/closed_form_v1.py"
    - "frozen/code/04_代码/main_model/q1_routes/enumeration_v1.py"
    - "frozen/code/04_代码/main_model/q1_routes/absorption_chain_v1.py"
    - "frozen/code/04_代码/checker/q1_quality_checker_v1.py"
    - "frozen/code/04_代码/scripts/run_g2_02_v1.py"
    - "frozen/code/04_代码/tests/test_q1_quality_main_v1.py"
    - "frozen/code/04_代码/tests/test_q1_quality_checker_v1.py"
    - "frozen/code/04_代码/tests/test_run_g2_02_v1.py"
    - "single_test_unconditional_v1/request.json"
    - "single_test_unconditional_v1/response.json"
    - "single_test_unconditional_v1/check_report.json"
    - "single_test_unconditional_v1/e1.stdout.txt"
    - "single_test_unconditional_v1/e1.stderr.txt"
    - "single_test_unconditional_v1/e2.stdout.txt"
    - "single_test_unconditional_v1/e2.stderr.txt"
    - "standard_chain_v1/request.json"
    - "standard_chain_v1/response.json"
    - "standard_chain_v1/check_report.json"
    - "standard_chain_v1/e1.stdout.txt"
    - "standard_chain_v1/e1.stderr.txt"
    - "standard_chain_v1/e2.stdout.txt"
    - "standard_chain_v1/e2.stderr.txt"
  canonical_requests:
    - "两个 request 的 scenario_role=canonical_g2_02，upstream.mode=bound_frozen，reference 分别指向 frozen/upstream 下的两个 response.json，sha256 与 semantics_expect 按本包 frozen_sha256。"
    - "request_id 分别为 <run_id>:single_test_unconditional_v1 与 <run_id>:standard_chain_v1。"
    - "所有 q/e 数字只允许 E1 从本 run 的 frozen/parameters.csv 与上游文件实际读取后进入 response；runner 不填任何数值。"
  formal_child_argv_templates:
    E1: "python <run_root>/frozen/code/04_代码/main_model/q1_quality_v1.py --request <run_root>/<semantics>/request.json --parameters <run_root>/frozen/parameters.csv --upstream <run_root>/frozen/upstream/<semantics>/response.json --schema <run_root>/frozen/q1_quality_v1.schema.json --output <run_root>/<semantics>/response.json"
    E2: "python <run_root>/frozen/code/04_代码/checker/q1_quality_checker_v1.py --response <run_root>/<semantics>/response.json --parameters <run_root>/frozen/parameters.csv --upstream <run_root>/frozen/upstream/<semantics>/response.json --schema <run_root>/frozen/q1_quality_v1.schema.json --task-package <run_root>/frozen/G2-02_Q1概率与质量解析链.yaml --report <run_root>/<semantics>/check_report.json"
    path_rule: "argv 为 shell=False 字符串数组；实际路径可为绝对路径，但解析后必须位于同一 run_root 且分别等于上述冻结副本/产物路径。"
  serialization:
    json: "UTF-8、sort_keys=True、separators=(',', ':')、末尾 LF；数组顺序按本包冻结，禁止按哈希或文件系统顺序。"
    text_logs: "UTF-8，原样保存子进程 stdout/stderr；不得摘要替换。"
    hash_inventory: "file_hashes.sha256 使用小写 SHA-256、两个空格、POSIX 相对路径、按路径 Unicode code-point 升序、LF；排除 file_hashes.sha256 自身且不得列目录。"
  run_manifest_required:
    - "schema envelope q1_run_manifest 的全部必填字段。"
    - "PASS 时 artifacts 必须覆盖至少以下23项语义产物且每项路径/role唯一：task package、parameters、schema、fixture、2 个上游 response、upstream file_hashes、9 份 source/test code、2 request、2 response、2 check_report、commands.json；此外所有实际 stdout/stderr 均按 stdout_log/stderr_log role 枚举。九个 code artifact 必须各含 source_sha256_before、sha256(snapshot)、source_sha256_after 且三者相同。"
    - "FAIL/INCOMPLETE 时 artifacts 只列实际存在文件，可为0项；不得为满足数量伪造占位。E2 preflight 失败允许缺对应 check_report，但实际存在的 commands.json、stdout/stderr 必须列入，并由 manifest notes 记录 REPORT_CONTEXT_PREFLIGHT_FAILED。"
    - "task package hash 只在 manifest/artifact inventory 记录；任务包内不得自引用自身 hash。"
    - "manifest 不记录自身 hash；其 hash 只在 file_hashes.sha256 中记录。"
  check_report_required:
    - "每语义一个 q1_check_report；包含 run/check IDs、scenario_role、semantics、checker_status、frozen_input_hashes（parameters 与上游 response 的 SHA-256）、逐 quantity 的 response_value/independent_value/abs_deviation/tolerance/verdict、E_kernel_independent 12 键证书与存在性诊断、route_table_verdict 与 errors。"
    - "E2 只验证 response；不得读取 request。"
    - "report-context preflight 失败时 check_report 明确不存在；已有 --report 文件必须保持 SHA-256 与字节数不变。"
    - "E2 独立值必须用实际写入 report 的17有效位 public 值复算；independent 与 response 的 status/free_parameters/na 任一不一致即 FAIL；不得伪造0/证书，也不得把整个 report 降为无 items。"
  command_log_required:
    - "PASS 时 commands.json 必须恰有4条并按 E1主语义、E2主语义、E1替代语义、E2替代语义的冻结顺序记录精确 argv、cwd、UTC 起止、退出码及 stdout/stderr 相对路径。FAIL/INCOMPLETE 只记录实际启动的0至4条命令。"
    - "argv 使用 JSON 字符串数组而非 shell 拼接文本；runner 使用 subprocess.run(..., shell=False)。"
    - "四条命令中 E1/E2 的 argv[1] 必须是对应 run 内 frozen/code 项目相对路径；若指向工作树或其他副本，PASS 禁止。"
  completion_rule:
    - "只有 artifacts 满足 PASS 的23项语义产物最低集合、九份代码/测试快照 hash-before=snapshot=hash-after 且唯一、commands 恰有4条并执行冻结E1/E2副本、两个 E1 exit=0、两个 E2 exit=0 且 checker_status=PASS、所有声明文件存在、全部实际日志已枚举、冻结输入 hash 匹配，manifest overall_status 才能为 PASS。结构 schema 的 minItems=0 不得用于降低该语义门。"
    - "所有数值仅从 E1 子进程实际 response 原样进入证据包；runner 不复制聊天、fixture 期望或手算数为运行结果。"
    - "证据包创建后不可覆盖；验证发现失败时保留目录并标 FAIL/INCOMPLETE。"

integration_acceptance:
  commands:
    - "python -m json.tool 04_代码/src/schemas/q1_quality_v1.schema.json"
    - "python -m json.tool 04_代码/tests/fixtures/q1_quality_oracles_v1.json"
