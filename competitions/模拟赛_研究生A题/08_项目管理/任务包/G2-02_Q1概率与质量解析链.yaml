    - "git diff --check -- 08_项目管理/任务包/G2-02_Q1概率与质量解析链.yaml 04_代码/src/schemas/q1_quality_v1.schema.json 04_代码/tests/fixtures/q1_quality_oracles_v1.json 04_代码/main_model/q1_quality_v1.py 04_代码/main_model/q1_routes/closed_form_v1.py 04_代码/main_model/q1_routes/enumeration_v1.py 04_代码/main_model/q1_routes/absorption_chain_v1.py 04_代码/checker/q1_quality_checker_v1.py 04_代码/tests/test_q1_quality_main_v1.py 04_代码/tests/test_q1_quality_checker_v1.py"
  required_tests:
    - "fixture 全案例（O1-O6 与 O1c/O2c/O3c/O5c）在两个语义下与冻结分数期望按 1e-15 一致，status/free_parameters 精确匹配。"
    - "三条路线逐量 public 值两两最大绝对偏差<=1e-15；四格和与 lambda 和对 1 偏差<=1e-15。"
    - "canonical 两语义各从冻结上游 response 读取 A/B/C 核；修改上游临时副本会改变输出或触发 hash FAIL，证明未硬编码。"
    - "q_E 与四格/lambda 不因修改上游 diagnostics 而改变（E1 只读 process_id/q/e/alpha/beta/status）。"
    - "重复/缺失 parameter_id、q/e 域外、非法 decimal、额外字段、上游 hash/semantics 不符、canonical 上游非 UNIQUE 均按冻结错误行为失败。"
    - "E 不可行案例不投影：O3/O3c/O5c 分类 INFEASIBLE，alpha_E/beta_E 为 null 且 exit 0。"
    - "O5 beta_E=1 输出 lambda 全 NA、na=true、tilde 正常；q_E=0 时 tilde 也 NA。"
    - "O6 上游 NONIDENTIFIABLE 但下游确定；钉死 counts (3/4,1/2,1/2) 与 lambda=(1,0,0,0)，证明 SD-G2-02-LAMBDA-ONCE 被执行。"
    - "负向测试：篡改 response 的 q_E、把 INFEASIBLE 改 FEASIBLE 或裁剪 alpha_E、四格和不为1、lambda 和不为1、伪 12 键证书、ROUTE_MISMATCH 误报一致，E2 必须 FAIL。"
    - "E2 CLI 传入 --request 必须拒绝；文件访问测试证明 E2 未打开 request、外部 fixture、E1 源码或其他文档。"
    - "canonical E2 从 response.request_id 严格派生父 run_id；后缀/semantics 或前缀 regex 不符均 validation exit 2，且不得生成替代时间戳。"
    - "预置 --report 哨兵文件后触发 malformed request_id：exit 2、stderr 非空且哨兵 SHA-256/字节不变；目标原先不存在时运行后仍不存在。runner 必须以无 report 的 FAIL/INCOMPLETE manifest 留证。"
    - "runner 生成精确目录布局、两个 canonical request、四条命令记录、完整 manifest 与排除自哈希的 inventory；重复 run_id 必须失败且不覆盖。"
    - "正式 runner 在任何子进程前生成九份稳定代码/测试快照；源文件复制窗口变化必须阻断，PASS commands 必须指向冻结 E1/E2 副本且 manifest 以 source_code/test_code 枚举九份。"
    - "E2 embedded oracle 独立覆盖本包 E2_embedded_oracles 全部案例；文件访问测试继续证明未读取外部 fixture。"
  hashes_required:
    - "schema SHA-256"
    - "parameters.csv SHA-256"
    - "fixture SHA-256"
    - "两个上游 response.json SHA-256 与 upstream file_hashes.sha256 的 SHA-256"
    - "E1 四份、E2、runner 共六份 source_code 与 test_main、test_checker、test_runner 三份 test_code 的 source-before/snapshot/source-after SHA-256"
    - "原始 request/response/check report SHA-256（若产生）"
  no_pass_claim_yet: "本规格任务完成只表示可派发；CR-V3.1/C01、C02、C03、C04、C05、C19、C21 尚需 E1/E2 实际运行与 D 语义验收。"

post_run_state_governance:
  current_files_this_task: "CURRENT_STATE.md 与 CHANGELOG.md 在实现阶段只读/不修改；本规格冻结不代表 G2-02 已执行或通过。"
  update_preconditions:
