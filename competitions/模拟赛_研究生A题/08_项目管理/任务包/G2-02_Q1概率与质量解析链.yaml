interface_contract:
  schema_version: "q1_quality_v1"
  envelope_types: ["q1_request", "q1_response", "q1_check_report", "q1_run_manifest", "q1_command_log"]
  input_summary:
    request_fields:
      - "schema_version: const q1_quality_v1"
      - "envelope_type: const q1_request"
      - "request_id: 非空稳定字符串"
      - "scenario_role: canonical_g2_02 | generic | test_oracle"
      - "semantics: single_test_unconditional_v1 | standard_chain_v1"
      - "upstream: mode=bound_frozen + reference{run_id,file,sha256,semantics_expect} 或 mode=derive_from_values + values{q_a,q_b,q_c,q_d,e_a,e_b,e_c,e_e}"
      - "schema 强制：canonical_g2_02 必须 bound_frozen；generic/test_oracle 必须 derive_from_values"
    decimal_encoding: "q/e 与全部概率量使用 JSON 十进制字符串；禁止 NaN、Infinity、指数拼写和二进制浮点预处理。"
  output_summary:
    response_fields:
      - "schema_version, envelope_type, request_id, scenario_role, semantics"
      - "overall_status: ALL_ROUTES_AGREE | ROUTE_MISMATCH | HAS_INFEASIBLE | HAS_INDETERMINATE | FAILED_VALIDATION | NUMERICAL_FAILURE"
      - "abc_kernels: 严格 A,B,C 顺序；每项含 process_id、q、e、alpha、beta、status、free_parameters、source"
      - "ALL_ROUTES_AGREE/ROUTE_MISMATCH 时必填：q_E,G,Z_0,Z_1、reach_E_distribution(16)、E_kernel、E_rates、fourfold、anchors、lambda、multinomial、route_agreement、diagnostics"
      - "HAS_INFEASIBLE 时必填 infeasible_stage；stage=ABC_KERNEL 时 q_E 及下游全为 null；stage=E_KERNEL 时 q_E,G,Z_0,Z_1,reach_E_distribution,E_kernel 保留，E_rates/fourfold/anchors/lambda/multinomial/route_agreement 为 null"
    ordering: "abc_kernels 严格 A,B,C；reach_E_distribution 的索引 i=A+2B+4C+8D（A 为最低位），16 项按索引 0..15 升序；lambda.main 与 tilde 的键固定为 A,B,C,D。"
    serialization: "Python json.dump(..., ensure_ascii=False, sort_keys=True, separators=(',', ':'))；UTF-8；文件末尾一个 LF。"
  cli_contracts:
    E1_exact_cli: "python 04_代码/main_model/q1_quality_v1.py --request <request.json> --parameters <parameters.csv> --upstream <upstream_response.json> --schema <schema.json> --output <response.json>"
    E1_exit_codes:
      0: "请求有效且完成；允许 response 含 HAS_INFEASIBLE/HAS_INDETERMINATE 数学状态。"
      2: "输入 envelope、绑定、hash 或参数 CSV 验证失败；不得写部分 response。"
      3: "数值失败或三路对拍超出容差（overall_status 相应为 NUMERICAL_FAILURE/ROUTE_MISMATCH）；必须写出完整有效 response 后再以 3 退出。"
      4: "文件 I/O 或不可恢复序列化失败。"
    E2_exact_cli: "python 04_代码/checker/q1_quality_checker_v1.py --response <response.json> --parameters <parameters.csv> --upstream <upstream_response.json> --schema <schema.json> --task-package <task_package.yaml> --report <check_report.json>"
    E2_input_rule: "禁止 request 参数和 request 文件；只从 response 的 scenario_role、semantics、abc_kernels 与各输出字段独立复核；canonical 时再对 parameters.csv 的 parameter_id 回代。task package/schema 使用冻结固定路径。"
    E2_run_id_rule: >-
      E2 在任何 report 写入前先执行 report-context preflight：只读取 response JSON 顶层 scenario_role、request_id、semantics；
      scenario_role 必须为 canonical_g2_02，request_id 必须能按最后一个冒号严格拆成 <run_id>:<semantics>，后缀必须与 response.semantics 字节相同，
      前缀必须匹配 ^[0-9]{8}T[0-9]{12}Z_[0-9a-f]{8}$。任一条件失败则 exit 2、错误写 stderr，且 --report 目标必须不存在或保持原字节不变，
      不得创建、截断、覆盖或另造时间戳。仅 preflight 成功后，前缀才成为唯一 report_context_run_id，并原样写入所有后续 PASS/FAIL/VALIDATION_ERROR/NUMERICAL_ERROR report。
      generic/test_oracle CLI 同属 preflight 失败，不生成正式 report；其单元测试只调用 checker 内部纯函数。
    E2_exit_codes:
      0: "check_report.checker_status=PASS。"
      1: "独立复核任一 quantity 或证书 FAIL；写完整 FAIL report。"
      2: "若 report-context preflight 失败，只写 stderr 且不得创建或触碰 report；若 preflight 已成功，则后续 response/schema/parameters 验证错误写 schema-valid VALIDATION_ERROR report，并使用已派生父 run_id。"
      3: "checker 自身数值失败；写 NUMERICAL_ERROR report。"
      4: "文件 I/O 或不可恢复序列化失败。"

mathematical_specification:
  common:
    definitions:
      - "对 j∈{A,B,C,E}：X_j∈{0,1} 真实状态（1=有问题），Y_j∈{0,1} 观测（1=报告异常）。"
      - "alpha_j=P(Y_j=1|X_j=0)，beta_j=P(Y_j=0|X_j=1)；q_j=P(X_j=1)。"
      - "真实故障集合 H={j:X_j=1, j∈{A,B,C,D}}；D 无独立测试工序，仅在装置到达 E 的联接事件按 Bernoulli(q_D) 生成一次，E 重测不重抽。"
      - "每道工序独立执行初测；异常则完整重测同一道工序；重测再异常则装置退出；中断无观测不计有效尝试（G2 阶段不建模中断，此处仅口径说明）。"
    independence_scope: "主基线：A/B/C/D 初始状态相互独立，且给定真实状态后不同工序与不同有效尝试的观测误差相互独立；16 状态枚举与闭式共用该独立性。相关性敏感性不属于本包。"
  stage_0_upstream_input:
    - "canonical：从 bound_frozen 上游文件读取 A/B/C 的 public alpha/beta（17 有效位十进制），校验 hash 与 semantics；status 必须 UNIQUE_SOLUTION。"
    - "derive_from_values：E1 用 04_代码/main_model/observation_calibration_v1.py 的已验收求解器对 A/B/C 按输入 q/e 求解各自语义观测核。"
  stage_1_q_E:
    formulas:
      - "u_j=1-alpha_j^2（真实正常的装置通过工序 j 两次尝试的概率）"
      - "v_j=2*beta_j-beta_j^2（真实有问题的装置通过工序 j 两次尝试的概率）"
      - "g_j=(1-q_j)*u_j+q_j*v_j"
      - "G=g_A*g_B*g_C（到达 E 的无条件概率）"
      - "Q_0=(1-q_A)(1-q_B)(1-q_C)（A/B/C 全真实正常）"
      - "U=u_A*u_B*u_C（A/B/C 全真实正常时到达 E 的概率）"
      - "Z_0=(1-q_D)*Q_0*U（到达 E 且 H=∅）"
      - "Z_1=G-Z_0（到达 E 且 H≠∅）"
      - "q_E=Z_1/G（到达 E 总体中有真实故障的条件概率）"
    invariants: "0<=q_E<=1；Z_0+Z_1=G；q_E=0 当且仅当 Z_1=0。"
  stage_2_E_kernel:
    reuse_rule: "E1 对组 E 调用与 G2-01 相同的已验收求解器（single 闭式 / chain t-h 二分），输入 q=q_E、e=e_E；数值策略与证书沿用 G2-01 numeric_policy 全文。"
    feasibility_single: "0<q_E<1 时当且仅当 e_E<=2*min(q_E,1-q_E)；alpha_E=e_E/[2(1-q_E)]，beta_E=e_E/(2*q_E)。"
    feasibility_chain: "当且仅当 e_E<=e_max(q_E)，e_max 与解唯一性规则沿用 G2-01 standard_chain_v1 规格。"
    endpoint_rules: "q_E=0 或 q_E=1 的端点按 G2-01 common.endpoint_identifiability：e_E=0 时对应参数不可识别（NONIDENTIFIABLE_FAMILY），e_E>0 时 INFEASIBLE。"
    E_infeasible_behavior: "E 不可行 → overall_status=HAS_INFEASIBLE、infeasible_stage=E_KERNEL；保留 q_E 与上游结果；四格/lambda 等为 null；禁止投影 alpha_E/beta_E 到 [0,1] 造假解。"
    indeterminate_rule: >-
      上游或 E 核 NONIDENTIFIABLE 时，仅当自由参数经静态零权重分析确定不进入全部下游量才可继续并视为确定结果：
      自由 beta_j 权重为 q_j（v_j 只乘 q_j），故 q_j=0 时消失；自由 alpha_j 权重为 1-q_j（u_j 只乘 1-q_j），故 q_j=1 时消失；
      E 核自由 beta_E 权重为 q_E 与 Z_1（两者其一为 0 即消失），自由 alpha_E 权重为 1-q_E 与 Z_0。
      消失条件不满足 → overall_status=HAS_INDETERMINATE、infeasible_stage=ABC_KERNEL 或 E_KERNEL，下游为 null；禁止默认填 0、0.5 或 1。
  stage_3_E_rates:
    - "p_E_first_abnormal=q_E*(1-beta_E)+(1-q_E)*alpha_E"
    - "p_E_process_exit=q_E*(1-beta_E)^2+(1-q_E)*alpha_E^2（到达 E 条件下的 E 工序终局退出率，不是整机总体退出概率）"
    - "p_device_total_exit=p_GE+p_BE（由 stage_4 四格给出，交叉校验）"
  stage_4_fourfold:
    definitions:
      - "u_E=1-alpha_E^2；v_E=2*beta_E-beta_E^2"
      - "p_GP=Z_0*u_E（最终通过且 H=∅）"
      - "p_BP=Z_1*v_E（最终通过且 H≠∅）"
      - "p_GE=Q_0*(1-U)+Z_0*alpha_E^2（最终退出且已生成真实状态全正常：A/B/C 阶段误退 + E 阶段误退；未联接 D 不作反事实生成）"
      - "p_BE=1-p_GP-p_BP-p_GE（最终退出且 H≠∅）"
    invariants: "四格和为 1（Decimal 和 |sum-1|<=1e-15）；各概率在 [0,1]。"
    anchors: "E_S=100*(p_GP+p_BP)；E_PL=p_BP；E_PW=p_GE。"
    multinomial: "N=100（从 P037 读取并断言等于 100）；p=[p_GP,p_BP,p_GE,p_BE]；仅供 G3 C07 烟测使用，本包不解释。"
  stage_5_lambda:
    main_table: >-
      主口径为事件级等权：在所有已完成 E 真阳性测试事件中，把该事件当时真实故障集合 H 对其成员等权分摊。
      lambda_i = [ Σ_{H∋i, |H|>=1} P(H)*P(reach_E|H)/|H| ] / [ q_E*G ]，i∈{A,B,C,D}；
      归一后和为 1；完全正常装置的 E 假阳性不进入主表。
    counting_conventions:
      event_level: "每台故障装置到达 E 后的期望真阳性事件计数 = (1-beta_E)*(2-beta_E)（初测阳性与重测阳性均计入）。"
      first_test_only: "期望计数 = 1-beta_E（仅首次 E 测试为真阳性时计）。"
      at_most_once_per_device: "按 SD-G2-02-LAMBDA-ONCE：以该装置首次 E 有效真阳性计，期望 = 1-beta_E，与 first_test_only 同值同尺度。"
      equivalence: "三种口径的归一来源比例总体相等（公共计数因子只依赖 H 是否为空，不依赖成员构成）；计数尺度只有事件级与装置级两种，检查器按此结构断言，禁止宣称三种计数两两不同或彼此相等。"
    tilde_lambda: "tilde_lambda_i=P(i∈H | E 真阳性)=[ Σ_{H∋i} P(H)*P(reach_E|H) ]/[q_E*G]；不归一，和可大于 1；单列，不替代主表。"
    na_rule: "主表分母（E 真阳性事件总量）为 0（即 q_E=0 或 beta_E=1）时 lambda_i 全为 NA(null)；tilde 仅当 q_E=0 时为 NA。零分母必须输出 NA，禁止 0/0 填值或强制归一。"
    reach_E_distribution: "P(H|reach E)=P(H)*P(reach_E|H)/G，16 项和为 1，索引 i=A+2B+4C+8D。"
  route_A_closed_form:
    scope: "直接按 stage_1 至 stage_5 公式以 Decimal>=120 计算；P(H) 用闭式乘积 helper 表示。"
  route_B_enumeration:
    scope: "对 16 个 H 状态显式循环：P(H)=prod(q 或 1-q)（本路线自己的乘法代码）；P(reach_E|H)=prod_{j∈A,B,C} pass_j(X_j)，其中 pass_j(0)=(1-alpha_j)+alpha_j*(1-alpha_j)、pass_j(1)=beta_j+(1-beta_j)*beta_j 必须按两次尝试逻辑显式写出；E 入口按 q_D 分裂 D；逐状态累计四格、lambda 权 1/|H|、三种计数与 tilde。"
    forbidden: "不得 import 或调用 route_A/route_C 的任何函数（含 u/v/g/G/Z 辅助函数）。"
  route_C_absorption_chain:
    state_space:
      - "对 j∈{A,B,C}：相位状态 F_j（初测）、R_j（重测）、P_j（通过，吸收）、X_j（退出，吸收）；装置前 E 阶段为 64 个乘积状态。"
      - "任一 X_j 出现即进入装置退出吸收态；(P_A,P_B,P_C) 进入 E 阶段。"
      - "E 阶段：进入 E_F 时按 q_D 分裂为 (E_F,d=0)/(E_F,d=1) 两组；E_F→PASS（吸收）以 P(Y_E=0|H)，E_F→E_R 以 P(Y_E=1|H)；E_R→PASS 以 P(Y_E=0|H)，E_R→EXIT（吸收）以 P(Y_E=1|H)。"
    algorithm: >-
      对每个 H（含 d 分支）构造转移矩阵并做吸收概率线性求解（(I-Q)x=b 稠密高斯消元，Decimal>=120，部分主元）；
      期望真阳性计数用期望访问数线性系统（E_F/E_R 的访问期望 × P(Y_E=1|H)）；
      逐 H 用本路线自己的 P(H) 乘积加权后汇总四格、lambda、计数与 tilde。
      禁止 import 或调用 route_A/route_B 任何函数；禁止迭代截断近似。
  route_independence_rules:
    - "三条路线分文件实现，互不 import；只允许共享：schema 校验、参数/上游读取解析、Decimal 工具与序列化基础设施（放 q1_quality_v1.py 或独立公共模块，不得含求根、转移、求和或指标核心）。"
    - "route_agreement 由 q1_quality_v1.py 编排：逐量比较三条路线 public 值，最大绝对偏差写入 route_agreement；任一量超容差 → overall_status=ROUTE_MISMATCH 且 exit 3。"
  checker_independence_spec:
    - "E2 独立 oracle 在 checker 文件内自含实现：q_E 与四格/lambda 用 E2 自己的 16 状态求和代码（Fraction/Decimal 自写）；E 核用冻结的独立二维回代（chain：外层 alpha 二分、内层 beta 回代；single：直接闭式回代），与 G2-01 E2 算法一致但重新自含实现。"
    - "E2 禁止 import main_model 任何模块与 G2-01 或本包任何其他 checker 模块；禁止读取外部 fixture；oracle 期望只取本包 E2_embedded_oracles。"
    - "E2 对 response 每个 quantity 复核：response_value、independent_value、abs_deviation、tolerance、verdict；另验证 route 表一致性、E_kernel 12 键证书、四格和、lambda 和与 hash 绑定。"

numeric_policy:
  precision:
    - "p0=max(120, max_input_significant_digits+80)；全部 Q1 阶段算术（除 E 核求解外）只有 +,-,*,/ 的 Decimal 精确运算，无 sqrt。"
    - "E 核求解沿用 G2-01 numeric_policy（括区间、12 键证书、p0 自适应加精至多 p0+800、最多 300 次迭代、区间与 codomain [0,1] 交集规则）。"
  tolerances:
    cross_route_absolute: "1e-15（三条路线 public 值逐量最大绝对偏差）"
    conservation_absolute: "1e-15（四格和与 lambda 和对 1 的绝对偏差；sum 字段为 decimalSigned）"
    cross_channel_qE_distribution_absolute: "1e-15（q_E,G,Z_0,Z_1,reach_E_distribution：双方使用相同 public 上游核）"
    cross_channel_kernel_alpha_beta_absolute: "5e-11"
    cross_channel_e_max_absolute: "5e-12"
    cross_channel_aggregate_absolute: "1e-9（E_rates、fourfold、anchors、lambda、tilde、counts：双方 E 核各自求解后传播）"
    fraction_to_public_absolute: "1e-15（fixture 分数期望 vs public 十进制）"
    E1_public_residual_absolute: "5e-12（E 核 public 回读值原始方程残差）"
    E2_independent_residual_absolute: "2e-12（E2 独立根原始残差）"
  serialization:
    significant_decimal_digits: 17
    negative_zero: "必须规范化为 0"
  immutable_rule: "任何容差不得放宽、不得改相对容差、不得按样例调容差或把失败改为可行；如需改变必须 DECISION_REQUIRED。"

boundary_and_error_behavior:
  - "缺字段、额外字段、非法枚举、重复 process_id、非法 decimal、域外 q/e、上游 hash 不符、上游 semantics 不符、canonical 上游非 UNIQUE：FAILED_VALIDATION，整 envelope 不产生部分结果。"
  - "上游不可行：overall_status=HAS_INFEASIBLE、stage=ABC_KERNEL，q_E 与下游全 null，exit 0（有效数学结果）。"
  - "E 不可行：overall_status=HAS_INFEASIBLE、stage=E_KERNEL，q_E 保留、四格/lambda 等 null，exit 0。"
  - "不可识别且自由参数不消失：overall_status=HAS_INDETERMINATE，下游 null，exit 0；不得抽选代表解。"
  - "括区间、迭代或残差失败：overall_status=NUMERICAL_FAILURE，exit 3；禁止返回最后迭代冒充结果。"
  - "三路对拍超容差：overall_status=ROUTE_MISMATCH，写出完整 route 分表与 route_agreement 后 exit 3。"
  - "canonical 请求必须 bound_frozen 且 reference 与本包 frozen_sha256 一致；否则 FAILED_VALIDATION。"
  - "test_oracle/generic 请求必须 derive_from_values；禁止把其结果标为 canonical 或写入正式结果。"
  - "q_E=0 或 beta_E=1 时 lambda 主表全 NA(null)、na=true；tilde 仅在 q_E=0 时为 NA。"

