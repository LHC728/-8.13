# ============================================================================
# 2. checker 冻结接口（canonical interface）
# ============================================================================
checker_interface:
  path: "04_代码/checker/des_checker_v1.py"
  allowed_reads:
    - "immutable event_log"
    - "frozen des_config"
    - "scripted fixture"
    - "parameters.csv"
    - "shared read-only schemas"
    - "optional metrics block（仅作为被核对对象，不作为求解输入）"
  forbidden:
    - "import 04_代码/main_model/**"
    - "读取主 DES 内存状态"
    - "调用主 DES transition"
    - "调用主 dispatch loop"
    - "共享主指标函数"
    - "读取主模型派生内部对象"
    - "subprocess 调用主模型重新生成答案后对拍"
  time_rule: "exact rational / frozen integer tick semantics；禁止 float epsilon。1 tick=10min=1/6h；tick*6 必须整数，否则显式 FAIL。"

# ============================================================================
# 3. replay acceptance（必须独立复算至少）
