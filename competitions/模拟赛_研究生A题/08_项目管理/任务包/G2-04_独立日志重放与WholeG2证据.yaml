  must_recompute:
    - "bay occupancy"
    - "A/B/C/E resource occupancy"
    - "task release/start/end"
    - "effective_attempt_no"
    - "PASS/ABNORMAL observation"
    - "cancel reason"
    - "shift boundary"
    - "turnover"
    - "device terminal state"
    - "D creation timing（E2：ABC 全 PASS 同 timestamp、E release 之前、D_CREATED.seq < TASK_RELEASE(E).seq；E start 不生成；early exit not_created）"
    - "T"
    - "S"
    - "PL"
    - "PW"
    - "YXB ledger seam"
    - "FCFS release_time frozenness"
    - "K9 cross-shift retest assertions"
    - "event liveness observable consequences"

