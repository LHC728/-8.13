  - "设备年龄/代次/寿命状态完全重置"
  - "Q3 永不读取 Q2 终态设备状态"
  - "后续 K 集合恰为 {9,9.5,10,10.5,11,11.5,12}"
  - "七 K 必须完整枚举（G3 之后）；K=12 支配不是授权捷径"
  - "G3 仅提供接口与重置测试"
  - "G3 不运行七 K 正式实验"

