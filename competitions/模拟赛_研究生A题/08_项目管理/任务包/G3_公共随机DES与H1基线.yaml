  - "不同时间戳闭包之间时间严格前进"
  - "同时间戳闭包有限终止"
  - "随机故障/换新/校准不得产生零时间循环"
  - "设备不可用状态必须总有定义好的未来恢复/唤醒路径（除非批次终态）"

