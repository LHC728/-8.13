# 16. 统计同时推断（G3-DEC-06 冻结；用于未来正式比较，非调优）
# ============================================================================
simultaneous_inference:
  procedure: "paired batch-level bootstrap + Bonferroni family-wise correction"
  resampling_unit: "一个完整 100-device 批次"
  bootstrap_B: "10000"
  family_wise_confidence: "95%"
  rules:
    - "比较族在读取正式结果前声明"
    - "对预声明冻结参考比较，不用机会主义全对族"
    - "使用独立分析重采样 seed namespace（非 DES 物理随机流，不改 key_schema_v1 物理 world）"
    - "H1 调优候选选择不使用这些置信区间（用冻结调优目标 + 确定性 tie-break）"

