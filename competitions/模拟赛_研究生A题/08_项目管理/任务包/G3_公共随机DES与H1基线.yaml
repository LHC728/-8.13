# ============================================================================
# 2. 不得改变的 G2 accepted 语义（仅随机扩展，不重解释）
# ============================================================================
frozen_upstream_semantics:
  - "两个 device bays；A/B/C/E 各容量 1"
  - "同装置 A/B/C 可并行；E 等全部 A/B/C flow-pass"
  - "无维修；首次异常 → 同工序完整重测；第二次有效异常 → 装置退出"
  - "中断/取消无观测、不推进 effective_attempt_no；片段计年龄/YXB"
  - "D 仅 A/B/C 全 PASS 且装置仍 pending 时物化一次；E 重测不重抽 D"
  - "FCFS 键 (release_time, device_id, process_order, effective_attempt_no)；release_time 不可改；squad_id 排除"
  - "测试/换新—校准/周转不可跨班；恰班末完成允许；1h literal / 0.5h overlap 周转"
  - "Q3 跨班待重测保留原 release 与 attempt=2"

g2_layer_cross_reference: >-
  CR-V3.1/C06 G2 最小层（分布不变主命题）由 G2-02 闭合；CR-V3.1/C16 G2 键骨架层、
  CR-V3.1/C17 G2 最小重放层由 G2-04 闭合。G3 在这些层之上**扩展**而非重定义。

# ============================================================================
# 3. 随机键架构（key_schema_v1；Human Gate G3-DEC-05 冻结）
# ============================================================================
random_key_architecture:
  key_schema_version: "key_schema_v1"
  canonical_key: "key_schema_v1 | master_seed | namespace | replicate_id | entity_id | process_or_subsystem | attempt_or_generation"
  mapping: "U = (uint64_be(SHA256(UTF8(canonical_key))[0:8]) + 0.5) / 2^64"
  streams:
    U_X_device_true_state: "(namespace, replicate_id, device_id, subsystem)；subsystem 显式区分 A/B/C"
    U_D_d_materialization: "(namespace, replicate_id, device_id)；仅 D 合法物化时消费（D 专用流，不并入 ABC 槽）"
    U_Y_observation: "(namespace, replicate_id, device_id, process, effective_attempt_no)；仅有效完成消费"
    U_L_equipment_lifetime: "(namespace, replicate_id, resource, generation_no)；每设备代次恰一个 U_L"
    H2_future_stream: "reserved only；G3 不实现 H2"
  forbidden_in_physical_keys:
    - "run_id"
    - "execution_no"
    - "restart_no"
    - "wall-clock timestamp"
    - "container iteration order"
    - "event insertion order"
    - "strategy_id"
    - "policy_id"
    - "squad_id"
    - "worker_id"
    - "agent_id"
  no_observation_u_consumed_by:
    - "failure interruption"
    - "terminal cancellation"
    - "shift deferral"
    - "never-started task"
  crn_rule: >-
    意图 CRN 配对的策略/情景共享同一底层 canonical U world；scenario/config 标识不得注入物理 U 键。
    配置可在冻结分布参数不同时对同一 U 做不同变换。禁止静默引入执行相关熵。
  experiment_namespaces（六不相交）:
    development_unit: "namespace=development_unit"
    pilot: "namespace=pilot"
    h1_tuning: "namespace=h1_tuning"
    g3_holdout: "namespace=g3_holdout"
    q2_formal: "namespace=q2_formal"
    q3_formal: "namespace=q3_formal"
  order_independence: "键不依赖容器遍历顺序/资源迭代顺序/事件插入顺序/squad_id；命名空间与字段序按 UTF-8 固定规范化；禁止语言运行时默认 hash()"

# ============================================================================
# 4. C13 设备寿命模型（主模型 = 分段线性 CDF；常风险 = 敏感性）
# ============================================================================
lifetime_model:
  main: "分段线性 CDF：F(t)=F_120*t/120 (0<=t<=120)；F_120+(F_240-F_120)(t-120)/120 (120<t<=240)"
  sensitivity: "常风险构造：h1=-ln(1-F_120)/120、h2=-ln((1-F_240)/(1-F_120))/120；仅敏感性，非 G3 主模型"
  per_generation: "每设备代次恰抽一个 U_L"
  inverse_cdf_cases:
    - "0..120 h：t = 120*U/F_120"
    - "120..240 h：t = 120 + 120*(U-F_120)/(F_240-F_120)"
    - "U > F(240)：右删失寿命 >240 h（随机寿命超过 240；设备仍 240 确定性强制更换）"
  forbid: "禁止把 [0,240] 内 CDF 重新归一化到 U∈[0,F(240)]"
  oracle_units_required:
    - "A/B/C/E 各自的 F(120)、F(240)、节点下方/上方邻域、U>F(240) 分支"
    - "独立单位/oracle 测试命中上述全部 case"

# ============================================================================
# 5. C14 再生语义（a=当前年龄，d=请求时长；Human Gate 决策）
# ============================================================================
regeneration_semantics:
  cases:
    - "a+d < 240：任务可启动（受其他约束）"
    - "a+d = 240：可完成；同刻完成先结算，随后强制换新"
    - "a+d > 240：启动前强制换新 + 校准"
    - "随机故障早于任务完成：片段中断、计年龄/YXB、无观测、attempt 不变、设备不可用、换新+校准"
  replacement:
    - "new generation_no；age 归零；新代次抽新 U_L"
  calibration:
    - "时长 = parameters.csv 冻结资源校准时长（30/20/20/40 min）"
    - "不计设备测试年龄；不可跨班"
  event_order:
    - "同刻：先结算完成，再处理故障/240 强制换新"
    - "DES 事件规范按 V3.1 §10：完成→观测→判定→退出→取消→更新故障/换新/校准/周转/资源/班历→批量 FCFS 派工"
  illegal_crossing_fallback: "底层状态机保留『非法任务运行至 240h 时强制中断』的兜底检查，并配套故障注入用例（与 V3.1 §7 一致）"

# ============================================================================
# 6. H1 强制基线（H1/R1）
# ============================================================================
h1_baseline:
  core_dispatch: "固定全局 FCFS；每个事件闭包后启动所有互不冲突、可在本班完成的合法 FCFS 队首"
  no_added_policies: "禁止 SPT/LPT/ATC/metaheuristic"
  only_new_policy_dimension: "预防更换（C26）为 G3 唯一新增 H1 策略维度"
  q2_calendar_interface:
    - "N=100；单班 12h/天；班外全部停工"
    - "初态：首两台在台位、设备已校准、age=0、代次初始化一致"
    - "T 保持日历时间语义"
    - "不发布 Q2 正式数字"
  q3_interface:
    - "N=100 全新独立批次；年龄/代次/寿命流完全重置"
    - "K ∈ {9,9.5,10,10.5,11,11.5,12}；两班连续/天；停工 24-2K"
    - "仅接口支持；不枚举 K、不推荐 K"

# ============================================================================
# 7. C26 预防更换政策（Human Gate 冻结决策集）
# ============================================================================
c26_preventive_replacement:
  frozen_constraints:
    - "预防更换仅当 age >= 120h"
    - "a+d>240 是强制更换，永远不是预防选择"
    - "预防更换只能发生在合法空闲决策点"
    - "换新+校准必须满足班界规则"
    - "H1 保持 FCFS"
  coarse_candidates（G3-DEC-01 冻结）:
    - "120"
    - "144"
    - "168"
    - "192"
    - "216"
    - "NO_PM_BEFORE_MANDATORY（永不预防更换；只执行冻结强制年龄规则）"
  no_240_as_preventive: "240h 行为属强制更换语义；不把 240 编码为普通预防阈值；NO_PM_BEFORE_MANDATORY 是独立政策基线，非 tau_pm=240"
  local_refinement（G3-DEC-02 冻结）:
    rule: "若最佳粗候选为数值 tau_pm：恰一轮局部细化，center=最佳粗值、window=±12h、step=6h，裁剪到合法预防域 tau_pm∈[120,240)，去重已评估候选"
    no_fake_grid: "若粗胜者为 NO_PM_BEFORE_MANDATORY：不在 240 周围构造假局部网格；不进行第二轮细化"
  positive_preventive_trigger（Human Gate §2 冻结，逐条）:
    - "A. 资源空闲"
    - "B. 确定当前冻结 FCFS 队首"
    - "C. 评估全部普通前置/资源/状态要求"
    - "D. 强制更换优先：a+d>240 → 任务前强制换新+校准（非预防）"
    - "E. 边界：a+d==240 → 可完成；完成先结算；随后强制换新"
    - "F. 否则若 a>=tau_pm（数值预防政策）→ 先预防换新+校准再服务队首"
    - "G. NO_PM_BEFORE_MANDATORY 下 F 永不触发"
    - "H. 换新+校准须遵守 no-cross-shift；若无法在本班合法完成：不非法启动、不消费任务观测随机性、保留队列/release 语义并在下一合法班唤醒"
    - "校准后：age=0、generation_no+1、新代次绑定新 U_L、派工重估保留的 FCFS 状态"
    - "禁止实现者自定义任意预防行为"
  tuning_objective（Human Gate §1 冻结）:
    primary: "minimize mean batch completion time T on h1_tuning worlds"
    quality_is_constraint: "质量指标为验证约束而非调优目标（在 accepted 质量分离条件下）"
  tie_break（Human Gate §1 冻结）:
    - "仅当 canonical 存储的 mean T 精确相等时触发"
    - "次序：1. 更少预防更换；2. 更大 tau_pm；3. NO_PM_BEFORE_MANDATORY 视为最不激进政策"
    - "禁止任意 epsilon tie；禁止用 CI 重叠作调优 tie；禁止用 holdout 破 tie"

# ============================================================================
# 8. 数据分离（C16；G3-DEC-03/04/05 冻结）
# ============================================================================
data_separation:
  tuning_repetitions（G3-DEC-03）: "每候选 20 独立 100-device 批次；同一次调优比较中全部候选使用完全相同 20 个 canonical CRN worlds；namespace=h1_tuning"
  holdout（G3-DEC-04）: "100 独立 100-device 批次；namespace=g3_holdout；仅在粗搜索+局部细化+tie-break+最终 H1 候选冻结完成后使用；禁止因 holdout 结果改 tau_pm/候选集/策略逻辑/键 schema/统计程序；holdout 暴露真实实现/语义失败 → 失效并回治理，不在 holdout 上重调"
  namespaces: "development_unit / pilot / h1_tuning / g3_holdout / q2_formal / q3_formal（六不相交）"
  pilot_role: "namespace=pilot 用于实现阶段小规模调试/烟测运行（如关键路径冒烟、键 schema 校验）；正式重复数已由 G3-DEC-03/04 冻结，pilot 不产生任何被采纳的候选或数字"
  rules:
    - "各命名空间使用独立 seed 池，不得碰撞"
    - "禁止因结果好看而事后选择正式重复数"

# ============================================================================
# 9. C06 full 质量分离 oracle（主证明 = 确定性配对路径相等）
# ============================================================================
c06_quality_separation:
  primary_proof: "同一 canonical 随机世界下，独立 oracle 与 DES 逐装置一致：true terminal state、D 生成、final pass/exit、GP/BP/GE/BE 类别、PL contribution、PW contribution（合法排程/策略变体下，分离命题假设适用处）"
  not_replace_with: "不得仅用 Monte Carlo 置信区间替代上述确定性配对路径相等证明"
  scope_limits: "YXB 不在分离命题覆盖范围；策略只改变 T/YXB/取消片段/设备年龄/换新次数/经验 hat e"

# ============================================================================
# 10. C07 统计烟测
# ============================================================================
c07_smoke:
  terminal_four_category: "终局四类别批次计数 vs 冻结解析多项分布锚"
  empirical_lambda: "批次（100 台）为聚类单位；禁止逐批比率简单平均"
  analytic_lambda: "不报 Monte Carlo CI"
  miss_handling: "单次普通 95% 未覆盖触发调查，不自动判程序错误"
  diagnostics_only: "规定诊断输出，不挑结果"

# ============================================================================
# 11. C16 G3 experiment-level 随机检查
# ============================================================================
c16_experiment_checks:
  - "容器遍历置换不改变 canonical 生成的 U/事件"
  - "意图 CRN 比较的策略共享底层随机世界"
  - "中断片段不消费观测 U"
  - "pilot/tuning/holdout/formal 命名空间不可碰撞"
  - "同 seed + config + code → 字节/canonical 可复现输出（显式列出的 run metadata 除外）"

# ============================================================================
# 12. C17 full replay/checker
# ============================================================================
c17_full_replay:
  must_replay_independently:
    - "resource occupancy / bay occupancy / shift calendar"
    - "task release/start/end / attempt / observation / cancellation"
    - "equipment age / equipment generation / sampled lifetime / failure interruption / replacement / calibration / turnover"
    - "terminal state / T / S / PL / PW / YXB"
    - "resource ledger coverage over [0,T)"
  isolation: "checker 与主 DES transition/feasibility/metric 代码隔离（沿用 G2-04 C19 原则）"

