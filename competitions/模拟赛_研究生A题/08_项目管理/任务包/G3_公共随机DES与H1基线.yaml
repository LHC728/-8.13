title: "键控随机公共 DES：设备寿命/再生、H1 固定 FCFS 基线、质量分离 oracle 与 G3 出口仪表"
status: "FROZEN_FOR_IMPLEMENTATION"
drafted_date: "2026-08-14"
drafted_by_role: "D / G3 SPEC 起草（基于已签字权威文档 + Human Gate 决策落文）"
